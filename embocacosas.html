<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d201e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#title{position:absolute;left:14px;top:12px;font-weight:900;text-shadow:0 2px 8px #000}
#score{position:absolute;right:14px;top:12px;background:#000a;border:1px solid #ffffff2a;border-radius:10px;padding:8px 11px;font-weight:900}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#000a;padding:7px 10px;border-radius:8px;font-size:11px;white-space:nowrap}
#arrowEditorToggle{pointer-events:auto;position:absolute;left:14px;bottom:14px;border:1px solid #ffffff33;background:#111d;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}
#arrowEditor{pointer-events:auto;display:none;position:absolute;left:14px;top:54px;width:min(360px,88vw);max-height:calc(100vh - 90px);overflow:auto;background:#111e;border:1px solid #ffffff2a;border-radius:12px;padding:12px;backdrop-filter:blur(8px)}
#arrowEditor.show{display:block}
#arrowEditor h3{margin:0 0 8px;font-size:14px}
#arrowEditor .row{display:grid;grid-template-columns:94px 1fr;gap:8px;align-items:center;margin:6px 0}
#arrowEditor input{width:100%;box-sizing:border-box;background:#222;color:#fff;border:1px solid #ffffff22;border-radius:7px;padding:6px}
#arrowEditor button{border:1px solid #ffffff2a;background:#252525;color:#fff;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer;margin-right:6px;margin-top:8px}
#arrowOut{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;white-space:pre-wrap;background:#0008;border-radius:8px;padding:8px;margin-top:8px}
@media(max-width:650px){#title{font-size:13px}#hint{font-size:10px;bottom:58px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
  <div id="title">EMBOCACOSAS EN TACHO</div>
  <div id="score">0 / 0</div>
  <div id="hint">La flecha barre sola · mantené presionado para cargar · soltá para tirar</div>
  <button id="arrowEditorToggle">EDITOR FLECHA</button>
  <div id="arrowEditor">
    <h3>Editor de flecha</h3>
    <div class="row"><label>Rot X °</label><input id="arx" type="number" step="1" value="14"></div>
    <div class="row"><label>Rot Y °</label><input id="ary" type="number" step="1" value="0"></div>
    <div class="row"><label>Rot Z °</label><input id="arz" type="number" step="1" value="0"></div>
    <div class="row"><label>Pos X</label><input id="apx" type="number" step="0.01" value="0"></div>
    <div class="row"><label>Pos Y</label><input id="apy" type="number" step="0.01" value="0.58"></div>
    <div class="row"><label>Distancia</label><input id="apz" type="number" step="0.01" value="-0.82"></div>
    <div class="row"><label>Barrido °</label><input id="asweep" type="number" step="1" value="24"></div>
    <div class="row"><label>Curva</label><input id="acurve" type="number" step="0.01" value="0.10"></div>
    <div class="row"><label>Largo base</label><input id="alen" type="number" step="0.01" value="0.36"></div>
    <button id="copyArrow">Copiar configuración</button>
    <div id="arrowOut"></div>
  </div>
</div>
<script type="module">
const v=Date.now();
import(`./embocacosas.js?v=${v}`).catch(err=>{
  console.error(err);
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9999;background:#511;color:white;padding:10px;border-radius:8px;font-family:monospace;max-width:90vw';
  d.textContent='Error cargando versión nueva: '+(err?.message||err);
  document.body.appendChild(d);
});
</script>
</body>
</html>
