<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202321;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;z-index:10}#title{position:absolute;left:14px;top:12px;font-weight:900;text-shadow:0 2px 8px #000}#status{position:absolute;left:14px;bottom:14px;background:#000b;border:1px solid #ffffff22;border-radius:9px;padding:8px 10px;font-size:12px;max-width:min(680px,88vw);white-space:pre-line}#status.ok{background:#102815cc}#status.warn{background:#3a2d0dcc}#status.err{background:#421111dd}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div id="title">EMBOCACOSAS EN TACHO</div><div id="status">Iniciando…</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const AS='./embocacosas-assets/';
const statusEl=document.getElementById('status');
const log=[];
function status(msg,kind=''){log.push(msg);statusEl.textContent=log.join('\n');statusEl.className=kind;console.log('[Embocacosas]',msg)}
function tex(url,onOk){
  const l=new THREE.TextureLoader();
  l.load(url,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());onOk(t);status('✓ '+url)},undefined,e=>status('⚠ No cargó '+url+' (la escena sigue)','warn'));
}

let renderer;
try{
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8c908a);
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,100);
  camera.position.set(0,2.35,6.6);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true;
  document.body.prepend(renderer.domElement);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(.25,1.45,-1.8);
  controls.enableDamping=true;
  controls.dampingFactor=.06;
  controls.minDistance=3;
  controls.maxDistance=12;

  scene.add(new THREE.HemisphereLight(0xffffff,0x4b514c,2.1));
  const sun=new THREE.DirectionalLight(0xfff3dc,2.4);sun.position.set(-4,7,5);sun.castShadow=true;scene.add(sun);

  // PARED: aparece SIEMPRE, aun si falla la textura.
  const wallMat=new THREE.MeshStandardMaterial({color:0xd3d0c6,roughness:1});
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(9.6,7.2),wallMat);
  wall.position.set(0,3.6,-3);wall.receiveShadow=true;scene.add(wall);
  tex(AS+'wall.jpg',t=>{wallMat.map=t;wallMat.color.set(0xffffff);wallMat.needsUpdate=true});

  // PISO: aparece SIEMPRE.
  const floorMat=new THREE.MeshStandardMaterial({color:0x5e615e,roughness:1});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),floorMat);
  floor.rotation.x=-Math.PI/2;floor.position.set(0,0,1.2);floor.receiveShadow=true;scene.add(floor);
  tex(AS+'floor.jpg',t=>{floorMat.map=t;floorMat.color.set(0xffffff);floorMat.needsUpdate=true});

  // CAJA AZUL: cubo simple con textura frontal.
  const blueSide=new THREE.MeshStandardMaterial({color:0x245b78,roughness:.8,metalness:.12});
  const boxMesh=new THREE.Mesh(new THREE.BoxGeometry(1.18,.9,.3),blueSide);
  boxMesh.position.set(3.05,1.72,-2.72);boxMesh.castShadow=true;scene.add(boxMesh);
  const faceMat=new THREE.MeshStandardMaterial({color:0x245b78,roughness:.9});
  const face=new THREE.Mesh(new THREE.PlaneGeometry(1.12,.84),faceMat);
  face.position.set(3.05,1.72,-2.565);scene.add(face);
  tex(AS+'box.jpg',t=>{faceMat.map=t;faceMat.color.set(0xffffff);faceMat.needsUpdate=true});

  // Marcador visible para saber dónde debería quedar el tacho si el GLB falla.
  const marker=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,1.35,32,1,true),new THREE.MeshStandardMaterial({color:0xe5b51c,transparent:true,opacity:.18,side:THREE.DoubleSide}));
  marker.position.set(.65,.675,-1.55);scene.add(marker);

  // Carga del GLB sin bloquear ni romper pared/piso/caja.
  const gltfLoader=new GLTFLoader();
  gltfLoader.load(AS+'tacho.glb',g=>{
    const root=g.scene;
    root.updateMatrixWorld(true);
    let bb=new THREE.Box3().setFromObject(root);
    const sz=new THREE.Vector3();bb.getSize(sz);
    const targetH=1.38;
    const s=sz.y>0 ? targetH/sz.y : 1;
    root.scale.setScalar(s);
    root.updateMatrixWorld(true);
    bb=new THREE.Box3().setFromObject(root);
    const center=new THREE.Vector3();bb.getCenter(center);
    const minY=bb.min.y;
    root.position.x += .65-center.x;
    root.position.z += -1.55-center.z;
    root.position.y += -minY;
    root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(root);
    marker.visible=false;
    status('✓ tacho.glb cargado','ok');

    // Aplicar atlas amarillo si el GLB tiene UVs. Si no, conservar sus materiales.
    tex(AS+'bin_atlas.jpg',t=>{
      let applied=0;
      root.traverse(o=>{
        if(o.isMesh && o.geometry?.attributes?.uv){
          o.material=new THREE.MeshStandardMaterial({map:t,roughness:.76,metalness:.1});
          applied++;
        }
      });
      status(applied?'✓ Texmap aplicado al tacho ('+applied+' mallas)':'⚠ El tacho no trae UVs; dejé su material original',applied?'ok':'warn');
    });
  },p=>{
    if(p.total) status('Cargando tacho.glb… '+Math.round(p.loaded/p.total*100)+'%');
  },e=>{
    console.error('GLB error',e);
    status('⚠ tacho.glb no cargó. Pared, piso y caja deberían seguir visibles. Mirá la consola para el detalle.','warn');
  });

  function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  status('✓ Motor 3D iniciado');
}catch(e){console.error(e);status('ERROR DE MOTOR: '+(e?.message||String(e)),'err')}
</script>
</body>
</html>
