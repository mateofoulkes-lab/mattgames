<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202321;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#title{position:absolute;left:16px;top:14px;font-weight:900;text-shadow:0 2px 8px #000}
#status{position:absolute;left:16px;bottom:14px;background:#000a;border:1px solid #ffffff26;border-radius:9px;padding:7px 10px;font-size:12px;backdrop-filter:blur(5px)}
#error{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(650px,88vw);padding:14px 16px;background:#2b1010e8;border:1px solid #ff777766;border-radius:12px;font-size:13px;line-height:1.4;pointer-events:auto}
</style>
</head>
<body>
<div id="ui">
  <div id="title">EMBOCACOSAS EN TACHO</div>
  <div id="status">Cargando escena 3D…</div>
  <div id="error"></div>
</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import { OrbitControls } from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const AS='embocacosas-assets/';
const status=document.getElementById('status');
const errorBox=document.getElementById('error');
function showError(err){
  console.error(err);
  errorBox.style.display='block';
  errorBox.textContent='No se pudo cargar la escena: '+(err?.message||err);
  status.textContent='Error de carga';
}

try{
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x858985);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.05,100);
  camera.position.set(0.2,2.2,6.4);

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  document.body.prepend(renderer.domElement);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0.3,1.4,-1.1);
  controls.enableDamping=true;
  controls.dampingFactor=0.06;
  controls.minDistance=3.2;
  controls.maxDistance=10;
  controls.maxPolarAngle=Math.PI*0.49;

  scene.add(new THREE.HemisphereLight(0xf4f4ed,0x4c4e49,2.0));
  const key=new THREE.DirectionalLight(0xfff0d3,2.4);
  key.position.set(-3,6,5);
  key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  scene.add(key);
  const fill=new THREE.PointLight(0xdde9ff,18,14,2);
  fill.position.set(4,3.5,3);
  scene.add(fill);

  const texLoader=new THREE.TextureLoader();
  const loadTexture=(name)=>new Promise((resolve,reject)=>{
    texLoader.load(AS+name,(t)=>{
      t.colorSpace=THREE.SRGBColorSpace;
      t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      resolve(t);
    },undefined,reject);
  });

  const [wallTex,floorTex,boxTex,binTex]=await Promise.all([
    loadTexture('wall.jpg'),
    loadTexture('floor.jpg'),
    loadTexture('box.jpg'),
    loadTexture('bin_atlas.jpg')
  ]);

  const wall=new THREE.Mesh(
    new THREE.PlaneGeometry(9.6,7.2),
    new THREE.MeshStandardMaterial({map:wallTex,roughness:0.95,metalness:0})
  );
  wall.position.set(0,3.6,-3.0);
  wall.receiveShadow=true;
  scene.add(wall);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(11.5,11.5),
    new THREE.MeshStandardMaterial({map:floorTex,roughness:0.92,metalness:0.02})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.set(0,0,1.4);
  floor.receiveShadow=true;
  scene.add(floor);

  const boxBody=new THREE.Mesh(
    new THREE.BoxGeometry(1.15,0.9,0.28),
    new THREE.MeshStandardMaterial({color:0x155f87,roughness:0.75,metalness:0.2})
  );
  boxBody.position.set(3.15,1.75,-2.72);
  boxBody.castShadow=true;
  scene.add(boxBody);

  const boxFront=new THREE.Mesh(
    new THREE.PlaneGeometry(1.08,0.82),
    new THREE.MeshStandardMaterial({map:boxTex,roughness:0.85,metalness:0.03})
  );
  boxFront.position.set(3.15,1.75,-2.57);
  scene.add(boxFront);

  const lock=new THREE.Mesh(
    new THREE.CylinderGeometry(0.055,0.055,0.035,20),
    new THREE.MeshStandardMaterial({color:0x222222,metalness:0.7,roughness:0.4})
  );
  lock.rotation.x=Math.PI/2;
  lock.position.set(3.48,1.62,-2.54);
  scene.add(lock);

  const gltfLoader=new GLTFLoader();
  status.textContent='Cargando tacho.glb…';
  const gltf=await gltfLoader.loadAsync(AS+'tacho.glb');
  const tacho=gltf.scene;

  let meshCount=0;
  tacho.traverse((o)=>{
    if(!o.isMesh) return;
    meshCount++;
    o.castShadow=true;
    o.receiveShadow=true;
    if(o.geometry?.attributes?.uv){
      o.material=new THREE.MeshStandardMaterial({map:binTex,roughness:0.72,metalness:0.14});
    }else{
      o.material=new THREE.MeshStandardMaterial({color:0xd9a400,roughness:0.72,metalness:0.14});
    }
  });

  scene.add(tacho);

  const bounds=new THREE.Box3().setFromObject(tacho);
  const size=new THREE.Vector3();
  const center=new THREE.Vector3();
  bounds.getSize(size);
  bounds.getCenter(center);

  if(size.y>0){
    const targetHeight=1.45;
    const scale=targetHeight/size.y;
    tacho.scale.setScalar(scale);
    tacho.updateMatrixWorld(true);

    const fitted=new THREE.Box3().setFromObject(tacho);
    const fittedCenter=new THREE.Vector3();
    fitted.getCenter(fittedCenter);
    tacho.position.x += 0.55-fittedCenter.x;
    tacho.position.z += -1.6-fittedCenter.z;
    tacho.updateMatrixWorld(true);

    const grounded=new THREE.Box3().setFromObject(tacho);
    tacho.position.y += -grounded.min.y;
  }

  const grid=new THREE.GridHelper(11,22,0x000000,0x444444);
  grid.position.y=0.006;
  grid.material.opacity=0.06;
  grid.material.transparent=true;
  scene.add(grid);

  status.textContent=`Escena cargada · tacho.glb: ${meshCount} mesh${meshCount===1?'':'es'}`;

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  animate();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}catch(err){
  showError(err);
}
</script>
</body>
</html>
