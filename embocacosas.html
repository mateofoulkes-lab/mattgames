<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d201e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#title{position:absolute;left:14px;top:12px;font-weight:900;text-shadow:0 2px 8px #000}
#score{position:absolute;right:14px;top:12px;background:#000a;border:1px solid #ffffff2a;border-radius:10px;padding:8px 11px;font-weight:900}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#000a;padding:7px 10px;border-radius:8px;font-size:11px;white-space:nowrap}
@media(max-width:650px){#title{font-size:13px}#hint{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
  <div id="title">EMBOCACOSAS EN TACHO</div>
  <div id="score">0 / 0</div>
  <div id="hint">La flecha barre sola · mantené presionado para cargar · soltá para tirar</div>
</div>
<script type="module">
const v=Date.now();
import(`./embocacosas.js?v=${v}`).catch(err=>{
  console.error(err);
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9999;background:#511;color:white;padding:10px;border-radius:8px;font-family:monospace;max-width:90vw';
  d.textContent='Error cargando versión nueva: '+(err?.message||err);
  document.body.appendChild(d);
});
</script>
</body>
</html>
