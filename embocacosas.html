<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1f1e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#title{position:absolute;left:14px;top:12px;font-weight:900;text-shadow:0 2px 8px #000}
#status{position:absolute;left:14px;bottom:14px;background:#000b;border:1px solid #ffffff22;border-radius:9px;padding:8px 10px;font-size:12px;max-width:min(760px,90vw);white-space:pre-line}
#status.ok{background:#102815cc}#status.warn{background:#3a2d0dcc}#status.err{background:#421111dd}
</style>
</head>
<body>
<div id="hud"><div id="title">EMBOCACOSAS EN TACHO</div><div id="status">Cargando escena.glb…</div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import { OrbitControls } from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const statusEl=document.getElementById('status');
function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className=kind;console.log('[Embocacosas]',text)}
function appendStatus(text,kind=''){statusEl.textContent += '\n'+text;if(kind)statusEl.className=kind;console.log('[Embocacosas]',text)}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x70736f);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;

scene.add(new THREE.HemisphereLight(0xffffff,0x444844,2.2));
const sun=new THREE.DirectionalLight(0xfff2d8,2.4);
sun.position.set(-4,7,5);sun.castShadow=true;scene.add(sun);

let root=null;
let tacho=null;
let tachoBaseRotX=0;
let tachoAngle=0;
let tachoOmega=0;
let tachoEnabled=false;

function findTacho(root){
  const all=[];
  root.traverse(o=>{if(o.name)all.push(o)});
  let hit=all.find(o=>/^(tacho|tambor|bin|drum)$/i.test(o.name));
  if(!hit) hit=all.find(o=>/(tacho|tambor|bin|drum)/i.test(o.name));
  return {hit,names:all.map(o=>o.name).filter(Boolean)};
}

function frameObject(obj){
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj);
  if(box.isEmpty()) return;
  const size=new THREE.Vector3();
  const center=new THREE.Vector3();
  box.getSize(size);box.getCenter(center);
  const maxDim=Math.max(size.x,size.y,size.z);
  const fov=camera.fov*Math.PI/180;
  let dist=(maxDim/2)/Math.tan(fov/2);
  dist*=1.45;
  camera.position.set(center.x+dist*.7,center.y+dist*.38,center.z+dist);
  camera.near=Math.max(.01,dist/1000);camera.far=Math.max(100,dist*20);camera.updateProjectionMatrix();
  controls.target.copy(center);controls.minDistance=maxDim*.25;controls.maxDistance=maxDim*6;controls.update();
}

function setupTachoPhysics(obj){
  tacho=obj;
  tachoBaseRotX=tacho.rotation.x;
  tachoAngle=0;
  tachoOmega=0;
  tachoEnabled=true;
  window.embocacosasGolpearTacho=(impulso=1)=>{
    const i=Number(impulso)||0;
    if(Math.abs(i)<.35) return false;
    tachoOmega+=THREE.MathUtils.clamp(i*.55,-4.5,4.5);
    return true;
  };
}

const loader=new GLTFLoader();
loader.load('./embocacosas-assets/escena.glb',gltf=>{
  root=gltf.scene;
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  scene.add(root);
  frameObject(root);

  const {hit,names}=findTacho(root);
  if(hit){
    setupTachoPhysics(hit);
    setStatus('✓ escena.glb cargada\n✓ tacho detectado: '+hit.name+'\nFísica de pivote activada.','ok');
  }else{
    setStatus('✓ escena.glb cargada\n⚠ No encontré un objeto cuyo nombre contenga “tacho”, “tambor”, “bin” o “drum”.\nObjetos: '+names.join(', '),'warn');
  }
},xhr=>{
  if(xhr.total) setStatus('Cargando escena.glb… '+Math.round(xhr.loaded/xhr.total*100)+'%');
},err=>{
  console.error(err);
  setStatus('No se pudo cargar escena.glb. Revisá la consola del navegador para el detalle.','err');
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.033);
  if(tachoEnabled&&tacho){
    const k=11.5;
    const damping=4.4;
    tachoOmega += (-k*tachoAngle-damping*tachoOmega)*dt;
    tachoAngle += tachoOmega*dt;
    tachoAngle=THREE.MathUtils.clamp(tachoAngle,-Math.PI*.42,Math.PI*.42);
    tacho.rotation.x=tachoBaseRotX+tachoAngle;
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

// Golpe de prueba: click izquierdo sobre el tacho. Después los objetos arrojados llamarán a la misma función con un impulso proporcional a masa*velocidad.
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  if(!tachoEnabled||e.button!==0)return;
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const meshes=[];tacho.traverse(o=>{if(o.isMesh)meshes.push(o)});
  if(raycaster.intersectObjects(meshes,true).length) window.embocacosasGolpearTacho(1.4);
});
</script>
</body>
</html>
