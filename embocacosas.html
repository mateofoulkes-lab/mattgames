<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Embocacosas en tacho</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d201e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#title{position:absolute;left:14px;top:12px;font-weight:900;text-shadow:0 2px 8px #000}
#score{position:absolute;right:14px;top:12px;background:#000a;border:1px solid #ffffff2a;border-radius:10px;padding:8px 11px;font-weight:900}
#status{position:absolute;left:14px;bottom:14px;background:#000b;border:1px solid #ffffff22;border-radius:9px;padding:8px 10px;font-size:11px;white-space:pre-line;max-width:min(620px,85vw)}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #0008}
#cross:after{content:"";position:absolute;left:7px;top:7px;width:4px;height:4px;border-radius:50%;background:#fff}
#hint{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#000a;padding:6px 9px;border-radius:8px;font-size:11px;white-space:nowrap}
#powerShell{position:absolute;left:50%;bottom:29px;transform:translateX(-50%);width:min(330px,72vw);height:11px;border-radius:99px;overflow:hidden;background:#000b;border:1px solid #ffffff33}
#power{height:100%;width:0%;background:linear-gradient(90deg,#7edb77,#ffd453,#ff5b49)}
#next{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font-size:12px;font-weight:800;text-shadow:0 2px 6px #000}
@media(max-width:650px){#title{font-size:13px}#hint{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
  <div id="title">EMBOCACOSAS EN TACHO</div>
  <div id="score">0 / 0</div>
  <div id="cross"></div>
  <div id="next"></div>
  <div id="hint">Mantené click/touch para cargar · soltá para tirar · botón derecho para mirar</div>
  <div id="powerShell"><div id="power"></div></div>
  <div id="status">Cargando escena…</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';

const AS='./embocacosas-assets/';
const statusEl=document.getElementById('status');
const scoreEl=document.getElementById('score');
const powerEl=document.getElementById('power');
const nextEl=document.getElementById('next');
const log=[];
function status(s){log.push(s);while(log.length>6)log.shift();statusEl.textContent=log.join('\n');console.log('[Embocacosas]',s)}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x878b86);
scene.fog=new THREE.Fog(0x878b86,14,28);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.05,100);
camera.position.set(0,2.2,6.5);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(.2,1.35,-1.65);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=3.2;
controls.maxDistance=10;
controls.mouseButtons={LEFT:null,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
controls.touches={ONE:null,TWO:THREE.TOUCH.DOLLY_PAN};
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

scene.add(new THREE.HemisphereLight(0xffffff,0x454b46,1.8));
const sun=new THREE.DirectionalLight(0xfff1d9,2.4);sun.position.set(-4,7,5);sun.castShadow=true;scene.add(sun);
const fill=new THREE.PointLight(0xeaf2ff,12,12,2);fill.position.set(3,3,3);scene.add(fill);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.allowSleep=true;
world.defaultContactMaterial.friction=.42;
world.defaultContactMaterial.restitution=.32;
const ground=new CANNON.Body({type:CANNON.Body.STATIC,shape:new CANNON.Plane()});
ground.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(ground);
const wallBody=new CANNON.Body({type:CANNON.Body.STATIC,shape:new CANNON.Box(new CANNON.Vec3(5,3.5,.08)),position:new CANNON.Vec3(0,3.5,-3.05)});world.addBody(wallBody);

let tacho=null, tachoBaseQuat=null, tachoAngle=0, tachoAV=0;
let tachoRestBox=null, tachoRestSize=new THREE.Vector3(), tachoRestCenter=new THREE.Vector3();
let tachoPivotWorld=new THREE.Vector3();
let tachoFoundName='';
const loader=new GLTFLoader();

loader.load(AS+'escena.glb',g=>{
  scene.add(g.scene);
  g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

  const candidates=[];
  g.scene.traverse(o=>{if(/tacho|tambor|bin|drum/i.test(o.name))candidates.push(o)});
  tacho=candidates.find(o=>o.isMesh||o.children.length) || candidates[0] || null;
  if(!tacho){
    const names=[];g.scene.traverse(o=>{if(o.name)names.push(o.name)});
    status('⚠ No encontré objeto tacho. Nombres: '+names.slice(0,20).join(', '));
  }else{
    tachoFoundName=tacho.name;
    tachoBaseQuat=tacho.quaternion.clone();
    tacho.updateMatrixWorld(true);
    tachoRestBox=new THREE.Box3().setFromObject(tacho);
    tachoRestBox.getSize(tachoRestSize);
    tachoRestBox.getCenter(tachoRestCenter);
    tacho.getWorldPosition(tachoPivotWorld);
    status('✓ Tacho: '+tacho.name+' · pivote sobre eje Z');
  }
  status('✓ escena.glb cargada');
},p=>{if(p.total)status('escena.glb '+Math.round(p.loaded/p.total*100)+'%')},e=>status('❌ Error escena.glb: '+(e?.message||String(e))));

const projectiles=[];
let attempts=0,hits=0,charging=false,chargeStart=0,nextType=0;
const TYPES=[
  {name:'ESFERA',mass:1.0},
  {name:'CUBO',mass:1.6},
  {name:'DONA',mass:1.25}
];
function refreshNext(){nextEl.textContent='Próximo: '+TYPES[nextType].name+' · '+TYPES[nextType].mass.toFixed(2)+' kg'}
refreshNext();
function refreshScore(){scoreEl.textContent=hits+' / '+attempts}

function makeProjectile(typeIndex,pos,vel){
  const type=TYPES[typeIndex];
  let geom,shape;
  if(typeIndex===0){geom=new THREE.SphereGeometry(.16,24,16);shape=new CANNON.Sphere(.16)}
  else if(typeIndex===1){geom=new THREE.BoxGeometry(.27,.27,.27);shape=new CANNON.Box(new CANNON.Vec3(.135,.135,.135))}
  else {geom=new THREE.TorusGeometry(.18,.065,12,28);geom.rotateX(Math.PI/2);shape=new CANNON.Sphere(.19)}
  const mat=new THREE.MeshStandardMaterial({color:typeIndex===0?0x4aa5ff:typeIndex===1?0xff7043:0xf3c64f,roughness:.58,metalness:.04});
  const mesh=new THREE.Mesh(geom,mat);mesh.castShadow=true;mesh.position.copy(pos);scene.add(mesh);
  const body=new CANNON.Body({mass:type.mass,shape,position:new CANNON.Vec3(pos.x,pos.y,pos.z),linearDamping:.015,angularDamping:.02});
  body.velocity.set(vel.x,vel.y,vel.z);
  body.angularVelocity.set((Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8);
  world.addBody(body);
  projectiles.push({mesh,body,type,mass:type.mass,scored:false,hitTacho:false,age:0,lastY:pos.y});
}

function throwCurrent(){
  const held=Math.min(1.5,(performance.now()-chargeStart)/1000);
  const power=0.35+held/1.5*.65;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const pos=camera.position.clone().addScaledVector(dir,.62);
  pos.y-=.08;
  const speed=7.5+power*10.5;
  const vel=dir.multiplyScalar(speed);vel.y+=1.2+power*1.5;
  makeProjectile(nextType,pos,vel);
  attempts++;refreshScore();
  nextType=(nextType+1)%TYPES.length;refreshNext();
  powerEl.style.width='0%';
}

function beginCharge(e){
  if(e.pointerType==='mouse' && e.button!==0)return;
  if(e.pointerType==='mouse' && e.buttons===2)return;
  charging=true;chargeStart=performance.now();
  try{renderer.domElement.setPointerCapture(e.pointerId)}catch{}
}
function endCharge(e){
  if(!charging)return;
  charging=false;throwCurrent();
}
renderer.domElement.addEventListener('pointerdown',beginCharge);
renderer.domElement.addEventListener('pointerup',endCharge);
renderer.domElement.addEventListener('pointercancel',()=>{charging=false;powerEl.style.width='0%'});

function currentTachoInfo(){
  if(!tacho)return null;
  tacho.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(tacho);
  const size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);
  return {box,size,center,topY:box.max.y,mouthR:Math.max(.12,Math.min(size.x,size.z)*.34)};
}

function impactTacho(p,info){
  if(p.hitTacho||!tacho)return;
  const q=p.mesh.position;
  const b=info.box;
  const pad=.12;
  if(q.x>b.min.x-pad&&q.x<b.max.x+pad&&q.y>b.min.y-pad&&q.y<b.max.y+pad&&q.z>b.min.z-pad&&q.z<b.max.z+pad){
    const v=p.body.velocity;
    const speed=Math.hypot(v.x,v.y,v.z);
    if(speed>1.2){
      const impulse=p.mass*speed;
      const side=Math.sign(q.x-info.center.x)||1;
      const threshold=2.2;
      if(impulse>threshold){
        tachoAV += side*Math.min(.9,(impulse-threshold)*.022);
      }
      p.body.velocity.z*=-.28;
      p.body.velocity.x*=.78;
      p.body.velocity.y*=.8;
      p.hitTacho=true;
    }
  }
}

function checkScore(p,info){
  if(p.scored||!info)return;
  const q=p.mesh.position;
  const dx=q.x-info.center.x,dz=q.z-info.center.z;
  const inside=Math.hypot(dx,dz)<info.mouthR;
  const crossed=p.lastY>info.topY+.03 && q.y<=info.topY+.03 && p.body.velocity.y<0;
  if(inside&&crossed){
    p.scored=true;hits++;refreshScore();status('🎯 ¡EMBOCADA! '+p.type.name);
    p.body.velocity.x*=.35;p.body.velocity.z*=.35;
  }
  p.lastY=q.y;
}

function updateTacho(dt){
  if(!tacho||!tachoBaseQuat)return;
  // resorte + amortiguación: pivota sobre el eje LOCAL Z del objeto exportado
  const stiffness=7.0,damping=2.8;
  tachoAV+=(-stiffness*tachoAngle-damping*tachoAV)*dt;
  tachoAngle+=tachoAV*dt;
  const max=.65;tachoAngle=Math.max(-max,Math.min(max,tachoAngle));
  const dq=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),tachoAngle);
  tacho.quaternion.copy(tachoBaseQuat).multiply(dq);
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(.033,clock.getDelta());
  world.step(1/60,dt,3);
  updateTacho(dt);
  const info=currentTachoInfo();
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.age+=dt;
    p.mesh.position.set(p.body.position.x,p.body.position.y,p.body.position.z);
    p.mesh.quaternion.set(p.body.quaternion.x,p.body.quaternion.y,p.body.quaternion.z,p.body.quaternion.w);
    if(info){checkScore(p,info);impactTacho(p,info)}
    if(p.age>18||p.body.position.y<-3){world.removeBody(p.body);scene.remove(p.mesh);projectiles.splice(i,1)}
  }
  if(charging){const held=Math.min(1.5,(performance.now()-chargeStart)/1000);powerEl.style.width=(held/1.5*100)+'%'}
  controls.update();renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
status('✓ Motor 3D + lanzamientos iniciado');
</script>
</body>
</html>
