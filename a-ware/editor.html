<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-WARE Editor</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:12px monospace}#a{display:grid;grid-template-columns:300px 1fr;height:100%}aside{padding:12px;background:#181818;overflow:auto}canvas{width:100%;height:100%;display:block}button,select,textarea{width:100%;margin:4px 0;padding:8px;background:#0e0e0e;color:#eee;border:1px solid #444}button{cursor:pointer}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}ul{padding:0;list-style:none;border:1px solid #333;max-height:230px;overflow:auto}li{padding:6px;border-bottom:1px solid #333;cursor:pointer}li.on{background:#063a49;color:#9ef4ff}textarea{height:190px}.h{font-size:10px;color:#999;line-height:1.4}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="a"><aside><h2>A-WARE ROOM EDITOR</h2><div class="h">La escena inicial es la misma del juego actual, pero con los modelos sólidos. Arrastrá para mover/rotar/escalar y exportá el resultado.</div><select id="model"></select><button id="add">Agregar modelo</button><ul id="list"></ul><div class="r"><button id="w">Mover W</button><button id="e">Rotar E</button><button id="r">Escalar R</button></div><div class="r"><button id="dup">Duplicar</button><button id="del">Borrar</button><button id="floor">Al piso</button></div><button id="home">Vista general</button><button id="out">Generar texto</button><textarea id="txt"></textarea><div class="h">Supr=borrar · Ctrl+D=duplicar · rueda=zoom · arrastrar fondo=girar cámara.</div></aside><canvas id="c"></canvas></div><script type="module">import * as T from'three';import{OrbitControls as O}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{TransformControls as X}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/TransformControls.js';import{GLTFLoader as G}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';import{FBXLoader as F}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js';const B='./assets/models/',$=x=>document.getElementById(x),files=['desktop_computer.glb','router.glb','cellphone.fbx','Laptop.fbx','stairs.glb','door.glb','Y Bot@Typing.fbx','Y Bot@Idle.fbx','Y Bot@Sitting.fbx','Y Bot@Texting While Standing.fbx','Y Bot@Standard Walk.fbx','Y Bot@Descending Stairs.fbx','Y Bot@Sleeping Idle.fbx','Y Bot@Sending Fax.fbx'],init=[['PC','desktop_computer.glb',1.6,-2.8,0,-1.1,.2],['ROUTER','router.glb',.5,3.4,.1,-2.2,-.3],['PHONE','cellphone.fbx',.35,1.3,.75,.25,.2],['LAPTOP','Laptop.fbx',1.05,3,0,1.7,-1],['STAIRS','stairs.glb',2.3,-5.4,0,1.6,.35],['DOOR','door.glb',2.6,5.2,0,-.3,-1.55],['HUMAN','Y Bot@Typing.fbx',3.15,-.25,0,.35,-.15]];const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x181a1d);const S=new T.Scene(),C=new T.PerspectiveCamera(55,1,.1,500);S.add(new T.HemisphereLight(0xffffff,0x333333,2));S.add(new T.GridHelper(30,30,0x55aaff,0x444444));const L=new T.DirectionalLight(0xffffff,2);L.position.set(6,10,5);S.add(L);const o=new O(C,R.domElement),x=new X(C,R.domElement);S.add(x);x.addEventListener('dragging-changed',q=>o.enabled=!q.value);x.setTranslationSnap(.25);x.setRotationSnap(T.MathUtils.degToRad(15));x.setScaleSnap(.1);const g=new G,f=new F,objs=[];let sel=null,n=1;files.forEach(v=>{$('model').add(new Option(v,v))});function home(){C.position.set(8,6,8);o.target.set(0,1,0);o.update()}home();async function load(file){return file.endsWith('.glb')?(await g.loadAsync(B+file)).scene:await f.loadAsync(B+file)}function norm(a,h){a.updateMatrixWorld(1);let b=new T.Box3().setFromObject(a),s=h/(b.max.y-b.min.y||1);a.scale.multiplyScalar(s);a.updateMatrixWorld(1);a.position.y-=new T.Box3().setFromObject(a).min.y}async function add(file,d){let a=await load(file),h=d?.h||1;norm(a,h);a.traverse(m=>{if(m.isMesh)m.material=new T.MeshNormalMaterial});let w=new T.Group;w.name=d?.name||file+'_'+n++;w.userData={file,h};w.add(a);S.add(w);if(d){w.position.set(d.x,d.y,d.z);w.rotation.y=d.ry}else w.position.y-=new T.Box3().setFromObject(w).min.y;objs.push(w);pick(w);return w}function pick(a){sel=a;x.detach();if(a)x.attach(a);draw()}function draw(){$('list').innerHTML='';objs.forEach(a=>{let l=document.createElement('li');l.textContent=a.name;if(a===sel)l.className='on';l.onclick=()=>pick(a);$('list').append(l)})}function del(){if(!sel)return;objs.splice(objs.indexOf(sel),1);S.remove(sel);x.detach();sel=null;draw()}async function dup(){if(!sel)return;let d=data(sel);d.name+='_COPY';d.x+=.5;d.z+=.5;let a=await add(d.file,d);a.rotation.set(...d.rotation);a.scale.set(...d.scale)}function data(a){let q=v=>Math.round(v*1000)/1000;return{name:a.name,file:a.userData.file,h:a.userData.h,x:q(a.position.x),y:q(a.position.y),z:q(a.position.z),ry:q(a.rotation.y),rotation:[q(a.rotation.x),q(a.rotation.y),q(a.rotation.z)],scale:[q(a.scale.x),q(a.scale.y),q(a.scale.z)]}}$('add').onclick=()=>add($('model').value);$('w').onclick=()=>x.setMode('translate');$('e').onclick=()=>x.setMode('rotate');$('r').onclick=()=>x.setMode('scale');$('del').onclick=del;$('dup').onclick=dup;$('floor').onclick=()=>{if(sel)sel.position.y-=new T.Box3().setFromObject(sel).min.y};$('home').onclick=home;$('out').onclick=()=>{$('txt').value=JSON.stringify({version:'a-ware-layout-v1',instances:objs.map(data)},null,2)};addEventListener('keydown',q=>{if(q.key==='Delete')del();if(q.key.toLowerCase()==='w')x.setMode('translate');if(q.key.toLowerCase()==='e')x.setMode('rotate');if(q.key.toLowerCase()==='r')x.setMode('scale');if(q.ctrlKey&&q.key.toLowerCase()==='d'){q.preventDefault();dup()}});function size(){let w=innerWidth-300,h=innerHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',size);size();(function loop(){requestAnimationFrame(loop);R.render(S,C)})();for(const d of init)await add(d[1],{name:d[0],h:d[2],x:d[3],y:d[4],z:d[5],ry:d[6]});pick(null);</script></body></html>
