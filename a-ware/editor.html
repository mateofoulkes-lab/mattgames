<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-WARE Editor v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:12px monospace}#app{display:grid;grid-template-columns:320px 1fr;height:100%}aside{padding:12px;background:#181818;overflow:auto;border-right:1px solid #333}canvas{width:100%;height:100%;display:block}button,select,input,textarea{width:100%;margin:4px 0;padding:8px;background:#0e0e0e;color:#eee;border:1px solid #444}input[type=checkbox]{width:auto;margin:0 7px 0 0;vertical-align:middle}button{cursor:pointer}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.snap{display:flex;align-items:center;padding:7px 8px;margin:5px 0 8px;border:1px solid #444;background:#0e0e0e}ul{padding:0;list-style:none;border:1px solid #333;max-height:180px;overflow:auto}li{padding:6px;border-bottom:1px solid #333;cursor:pointer}li.on{background:#063a49;color:#9ef4ff}textarea{height:190px}.h{font-size:10px;color:#999;line-height:1.4}h2{margin:0 0 8px}h3{color:#77eeff;margin:14px 0 4px}hr{border:0;border-top:1px solid #333;margin:14px 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="app"><aside><h2>A-WARE ROOM EDITOR v2</h2><div class="h">Objetos sólidos + waypoints animados del humano. W mover · E rotar · R escalar.</div><h3>OBJETOS</h3><select id="model"></select><button id="add">Agregar modelo</button><ul id="list"></ul><div class="r"><button id="w">Mover</button><button id="e">Rotar</button><button id="r">Escalar</button></div><label class="snap"><input id="snap" type="checkbox" checked>Snap activado</label><div class="r"><button id="dup">Duplicar</button><button id="del">Borrar</button><button id="floor">Al piso</button></div><button id="home">Vista general</button><hr><h3>WAYPOINTS HUMANO</h3><input id="wpName" placeholder="ej: usando_pc"><select id="wpAnim"></select><button id="wpCreate">Crear waypoint</button><ul id="wpList"></ul><button id="wpDelete">Borrar waypoint</button><div class="h">El humano fantasma reproduce la animación seleccionada. Ubicalo y rotalo donde corresponda.</div><hr><button id="out">GENERAR TEXTO</button><textarea id="txt"></textarea><div class="h">Pegame este JSON en el chat. Incluye habitación + waypoints.</div></aside><canvas id="c"></canvas></div><script type="module">import * as T from'three';import{OrbitControls as O}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{TransformControls as X}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/TransformControls.js';import{GLTFLoader as G}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';import{FBXLoader as F}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js';const B='./assets/models/',$=x=>document.getElementById(x);const files=['desktop_computer.glb','router.glb','cellphone.fbx','Laptop.fbx','stairs.glb','door.glb','cama.glb','mesadenoche.glb','doorway.glb','ac_indoor.glb','ceiling_fan.glb','coffee_table.glb','couch.glb','heating_battery.glb','tv.glb','smoke_alarm.glb'];const anims={typing:'Y Bot@Typing.fbx',idle:'Y Bot@Idle.fbx',sitting:'Y Bot@Sitting.fbx',phone:'Y Bot@Texting While Standing.fbx',walk:'Y Bot@Walking.fbx',stairs:'Y Bot@Descending Stairs.fbx',sleep:'Y Bot@Sleeping Idle.fbx',interact:'Y Bot@Sending Fax.fbx'};const layout=await(await fetch('./layout.json',{cache:'no-store'})).json();const init=layout.instances.map(d=>[d.name,d.file,d.h,d.position,d.rotation,d.scale]);const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x181a1d);const S=new T.Scene(),C=new T.PerspectiveCamera(55,1,.1,500);S.add(new T.HemisphereLight(0xffffff,0x333333,2));S.add(new T.GridHelper(40,40,0x55aaff,0x444444));const L=new T.DirectionalLight(0xffffff,2);L.position.set(6,10,5);S.add(L);const orbit=new O(C,R.domElement),tc=new X(C,R.domElement);S.add(tc.getHelper());tc.addEventListener('dragging-changed',q=>orbit.enabled=!q.value);function setSnap(on){tc.setTranslationSnap(on?.25:null);tc.setRotationSnap(on?T.MathUtils.degToRad(15):null);tc.setScaleSnap(on?.01:null)}setSnap(true);$('snap').onchange=e=>setSnap(e.target.checked);const gl=new G,fb=new F,objs=[],wps=[],mixers=[];let sel=null,wpSel=null,n=1;const ray=new T.Raycaster(),mouse=new T.Vector2();files.forEach(v=>$('model').add(new Option(v,v)));Object.entries(anims).forEach(([k,v])=>$('wpAnim').add(new Option(k+' — '+v,k)));function home(){C.position.set(14,10,16);orbit.target.set(-2,3,0);orbit.update()}home();function box(q,e,p){const m=new T.Mesh(new T.BoxGeometry(...e),new T.MeshNormalMaterial());m.position.set(...p);q.add(m)}function procedural(file){const q=new T.Group();if(file==='cama.glb'){box(q,[2,.18,1],[0,.28,0]);box(q,[1.92,.26,.95],[0,.5,0]);box(q,[.55,.16,.72],[-.62,.72,0]);box(q,[.12,.95,1.1],[-1.02,.72,0]);for(const x of[-.86,.86])for(const z of[-.38,.38])box(q,[.12,.38,.12],[x,.1,z])}else if(file==='mesadenoche.glb'){box(q,[.58,.68,.52],[0,.4,0]);box(q,[.66,.08,.6],[0,.78,0]);box(q,[.5,.18,.03],[0,.52,.275]);box(q,[.16,.05,.05],[0,.52,.315]);for(const x of[-.23,.23])for(const z of[-.2,.2])box(q,[.08,.22,.08],[x,.11,z])}else if(file==='doorway.glb'){box(q,[.14,2.2,.18],[-.57,1.1,0]);box(q,[.14,2.2,.18],[.57,1.1,0]);box(q,[1.28,.14,.18],[0,2.13,0])}else if(file==='smoke_alarm.glb'){const m=new T.Mesh(new T.CylinderGeometry(.5,.5,.18,24),new T.MeshNormalMaterial());m.rotation.x=Math.PI/2;q.add(m)}return q}async function load(file){if(['cama.glb','mesadenoche.glb','doorway.glb','smoke_alarm.glb'].includes(file))return procedural(file);return file.endsWith('.glb')?(await gl.loadAsync(B+file)).scene:await fb.loadAsync(B+file)}function norm(a,h){a.updateMatrixWorld(1);let b=new T.Box3().setFromObject(a),s=h/(b.max.y-b.min.y||1);a.scale.multiplyScalar(s);a.updateMatrixWorld(1);a.position.y-=new T.Box3().setFromObject(a).min.y}async function add(file,d={}){try{let a=await load(file),h=d.h||1;norm(a,h);a.traverse(m=>{if(m.isMesh)m.material=new T.MeshNormalMaterial});let w=new T.Group;w.name=d.name||file+'_'+n++;w.userData={file,h};w.add(a);S.add(w);w.position.fromArray(d.position||[0,0,0]);w.rotation.set(...(d.rotation||[0,0,0]));w.scale.fromArray(d.scale||[1,1,1]);if(!d.position)w.position.y-=new T.Box3().setFromObject(w).min.y;objs.push(w);pickObj(w);return w}catch(err){console.error(file,err)}}function pickObj(a){sel=a;wpSel=null;tc.detach();if(a)tc.attach(a);drawObj();drawWp()}function pickWp(a){wpSel=a;sel=null;tc.detach();if(a)tc.attach(a);drawObj();drawWp()}function drawObj(){const u=$('list');u.innerHTML='';objs.forEach(a=>{let l=document.createElement('li');l.textContent=a.name;if(a===sel)l.className='on';l.onclick=()=>pickObj(a);u.append(l)})}function drawWp(){const u=$('wpList');u.innerHTML='';wps.forEach(a=>{let l=document.createElement('li');l.textContent=a.userData.wpName+' ['+(a.userData.wpKind==='transit'?'TRÁNSITO':a.userData.wpAnim)+']';if(a===wpSel)l.className='on';l.onclick=()=>pickWp(a);u.append(l)})}function del(){if(sel){objs.splice(objs.indexOf(sel),1);S.remove(sel);sel=null}else if(wpSel){wps.splice(wps.indexOf(wpSel),1);S.remove(wpSel);wpSel=null}tc.detach();drawObj();drawWp()}async function dup(){if(!sel)return;const d=objData(sel);d.name+='_COPY';d.position[0]+=.5;d.position[2]+=.5;await add(d.file,d)}function objData(a){let q=v=>Math.round(v*1000)/1000;return{name:a.name,file:a.userData.file,h:a.userData.h,position:[q(a.position.x),q(a.position.y),q(a.position.z)],rotation:[q(a.rotation.x),q(a.rotation.y),q(a.rotation.z)],scale:[q(a.scale.x),q(a.scale.y),q(a.scale.z)]}}async function createWp(){const name=$('wpName').value.trim()||'waypoint_'+(wps.length+1),anim=$('wpAnim').value,file=anims[anim];const root=await fb.loadAsync(B+file);norm(root,3.15);root.traverse(m=>{if(m.isMesh)m.material=new T.MeshBasicMaterial({color:0x66ffff,transparent:true,opacity:.32,wireframe:true})});const w=new T.Group;w.name='WP_'+name;w.userData={wpName:name,wpAnim:anim,file};w.add(root);S.add(w);wps.push(w);if(root.animations?.[0]){const mx=new T.AnimationMixer(root);mx.clipAction(root.animations[0]).play();mixers.push(mx)}pickWp(w)}function wpData(a){let q=v=>Math.round(v*1000)/1000;return{name:a.userData.wpName,kind:a.userData.wpKind||'action',animation:a.userData.wpAnim,file:a.userData.file,position:[q(a.position.x),q(a.position.y),q(a.position.z)],rotation:[q(a.rotation.x),q(a.rotation.y),q(a.rotation.z)]}}$('add').onclick=()=>add($('model').value);$('wpCreate').onclick=createWp;$('wpDelete').onclick=()=>{if(wpSel)del()};$('w').onclick=()=>tc.setMode('translate');$('e').onclick=()=>tc.setMode('rotate');$('r').onclick=()=>tc.setMode('scale');$('del').onclick=del;$('dup').onclick=dup;$('floor').onclick=()=>{const a=sel||wpSel;if(a)a.position.y-=new T.Box3().setFromObject(a).min.y};$('home').onclick=home;$('out').onclick=()=>{$('txt').value=JSON.stringify({version:'a-ware-layout-v2',instances:objs.map(objData),waypoints:wps.map(wpData)},null,2)};R.domElement.addEventListener('pointerdown',q=>{if(tc.dragging)return;const rect=R.domElement.getBoundingClientRect();mouse.x=((q.clientX-rect.left)/rect.width)*2-1;mouse.y=-((q.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(mouse,C);const all=[...objs,...wps],hits=ray.intersectObjects(all,true);if(!hits.length)return;let a=hits[0].object;while(a&&!all.includes(a))a=a.parent;if(a)(wps.includes(a)?pickWp(a):pickObj(a))});addEventListener('keydown',q=>{if(q.key==='Delete')del();const k=q.key.toLowerCase();if(k==='w')tc.setMode('translate');if(k==='e')tc.setMode('rotate');if(k==='r')tc.setMode('scale');if(q.ctrlKey&&k==='d'){q.preventDefault();dup()}});function size(){let w=innerWidth-320,h=innerHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',size);size();let last=performance.now();(function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=(now-last)/1000;last=now;mixers.forEach(m=>m.update(dt));R.render(S,C)})();for(const d of init)await add(d[1],{name:d[0],h:d[2],position:d[3],rotation:d[4],scale:d[5]});for(const d of layout.waypoints){$('wpName').value=d.name;$('wpAnim').value=d.animation;await createWp();const w=wps[wps.length-1];w.userData.wpKind=d.kind||'action';w.position.fromArray(d.position);w.rotation.set(...d.rotation);}$('wpName').value='';pickObj(null);</script></body></html>
