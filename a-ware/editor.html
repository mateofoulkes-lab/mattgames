<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-WARE Editor</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:12px ui-monospace,Consolas,monospace}#app{display:grid;grid-template-columns:330px 1fr;height:100%}aside{background:#181818;border-right:1px solid #333;padding:12px;overflow:auto}canvas{width:100%;height:100%;display:block}h1{font-size:20px;margin:0 0 8px}h2{font-size:12px;color:#72eaff;margin:15px 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}label{display:block;font-size:10px;color:#aaa;margin-bottom:3px}input,select,textarea,button{width:100%;background:#0d0d0d;color:#eee;border:1px solid #444;padding:7px;font:inherit}button{cursor:pointer}button:hover{background:#242424}textarea{min-height:170px;resize:vertical}ul{list-style:none;margin:0;padding:0;border:1px solid #333;max-height:220px;overflow:auto}li{padding:6px 8px;border-bottom:1px solid #292929;cursor:pointer}li.active{background:#073443;color:#9ef1ff}.hint{font-size:10px;color:#999;line-height:1.4}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="app"><aside><h1>A-WARE Editor</h1><div class="hint">Misma escena inicial del juego, pero con mallas normales. Reacomodá todo y después tocá Generar texto.</div><h2>Agregar modelo</h2><select id="model"></select><div class="row"><button id="add">Agregar</button><button id="resetCam">Vista general</button></div><h2>Objetos</h2><ul id="list"></ul><div class="row"><button id="dup">Duplicar</button><button id="del">Borrar</button></div><h2>Transformar</h2><div class="row3"><button id="move">Mover W</button><button id="rot">Rotar E</button><button id="scale">Escalar R</button></div><div class="row"><button id="focus">Enfocar F</button><button id="ground">Apoyar al piso</button></div><div class="hint">Supr borrar · Ctrl+D duplicar · Q local/world · G snap</div><h2>Valores exactos</h2><div class="row3"><input id="px" type="number" step=".1" placeholder="X"><input id="py" type="number" step=".1" placeholder="Y"><input id="pz" type="number" step=".1" placeholder="Z"></div><div class="row3"><input id="rx" type="number" step=".1" placeholder="Rot X"><input id="ry" type="number" step=".1" placeholder="Rot Y"><input id="rz" type="number" step=".1" placeholder="Rot Z"></div><div class="row3"><input id="sx" type="number" step=".1" placeholder="Scale X"><input id="sy" type="number" step=".1" placeholder="Scale Y"><input id="sz" type="number" step=".1" placeholder="Scale Z"></div><button id="apply">Aplicar valores</button><h2>Exportar / importar</h2><div class="row"><button id="export">Generar texto</button><button id="import">Importar texto</button></div><textarea id="io"></textarea></aside><main><canvas id="scene"></canvas></main></div><script type="module" src="./editor.js"></script></body></html>
