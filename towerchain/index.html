<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tower Chain</title><link rel="stylesheet" href="style.css"></head><body><div id="splash" class="screen splash"><div class="splash-panel"><h1>TOWER CHAIN</h1><p>Protegé el cupcake. Rompé la lógica. Volvé ridícula la torre.</p><button id="startBtn">JUGAR</button><small>v0.1.3</small></div></div><div id="game" class="screen game hidden"><canvas id="canvas"></canvas><div class="topHud"><div class="objectiveLabel">🍰 PROTEGÉ EL CUPCAKE</div><div class="glassBar"><i id="glassFill"></i></div></div><div class="bottomHud"><div class="hudStat"><span>❤️ CAMPANA</span><b><span id="hp">100</span>%</b></div><div class="hudStat"><span>🌊 OLEADA</span><b><span id="wave">1</span>/60</b></div><div class="hudStat"><span>💰 ORO</span><b id="gold">0</b></div><div class="hudStat"><span>🏰 TORRE</span><b><span id="towerLevel">1</span>/20</b></div><div class="hudStat bonusStat"><span>💎 BONUS</span><b id="bonus">0</b></div><div class="speedGroup"><span>VELOCIDAD</span><button data-speed="1" class="active">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button data-speed="8">×8</button></div></div><div id="powerup" class="powerup hidden">💎</div><div id="cards" class="cards hidden"><div class="cardsTitle">ELEGÍ UNA MEJORA</div><div id="cardWrap" class="cardWrap"></div></div><div id="end" class="end hidden"><h2 id="endTitle"></h2><p id="endText"></p><button onclick="location.reload()">VOLVER A JUGAR</button></div><div class="version">v0.1.3</div></div><script src="game.js"></script></body></html>
