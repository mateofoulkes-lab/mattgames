<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite Tester</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Sprite Tester</h1><p>Matt Games · pipeline test</p></div><span class="ver">v0.1.1</span></header><section class="panel controls"><label>Sprite<select id="spriteSelect"></select></label><label>Acción<select id="actionSelect"></select></label><label>FPS<input id="fps" type="range" min="1" max="24" value="8"><span id="fpsValue">8</span></label><label><input id="loop" type="checkbox" checked> Loop</label><label><input id="flip" type="checkbox"> Flip X</label></section><section class="viewer checker" id="viewer"><canvas id="canvas" width="384" height="384"></canvas><div class="baseline" id="baseline"></div><div class="pivot" id="pivot"></div></section><section class="buttons"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="restart">↺ Restart</button><button id="prev">◀ Frame</button><button id="next">Frame ▶</button></section><section class="panel info"><div><b>Frame</b> <span id="frameInfo">1/1</span></div><div><b>Tamaño</b> <span id="sizeInfo">—</span></div><div><b>Pivot</b> bottom-center</div><button id="bgBtn">Cambiar fondo</button><button id="guidesBtn">Guías on/off</button></section></main><script src="app.js"></script></body></html>
