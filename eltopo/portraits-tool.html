<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait Cutter · MattGames</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 10px 30px #00000010;margin-bottom:20px}h1{margin:0 0 6px;font-size:30px}p{color:#5b6470;line-height:1.5}.drop{border:2px dashed #9ca3af;border-radius:18px;padding:28px;text-align:center;cursor:pointer;background:#fafafa}.drop.drag{border-color:#00a884;background:#ecfdf5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}.tile{background:#f8fafc;border-radius:16px;padding:12px}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}.tile strong{display:block;margin:10px 0 8px}button,.btn{border:0;border-radius:999px;padding:10px 16px;background:#00a884;color:white;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.muted{font-size:13px;color:#6b7280}.source-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.source-list button{background:#e5e7eb;color:#111827}.preview-wrap{position:relative;max-width:520px;margin:20px auto}.preview-wrap img{width:100%;display:block;border-radius:18px}.preview-wrap:before,.preview-wrap:after{content:"";position:absolute;background:#fff8;box-shadow:0 0 0 1px #0002}.preview-wrap:before{left:50%;top:0;width:2px;height:100%}.preview-wrap:after{top:50%;left:0;height:2px;width:100%}@media(max-width:600px){main{padding:14px}.card{padding:16px;border-radius:16px}}
</style>
</head>
<body><main>
<section class="card"><h1>Portrait Cutter</h1><p>Subí o elegí un PNG 2×2. La herramienta lo divide en cuatro retratos y los convierte a JPG. Si el archivo está en <code>portraitspng/</code>, GitHub Actions generará automáticamente los cuatro JPG dentro de <code>portraits/</code>.</p><label class="drop" id="drop">Arrastrá un mosaico PNG acá o tocá para elegir<input id="file" type="file" accept="image/png" hidden></label><div id="repoFiles" class="source-list"></div></section>
<section id="work" class="card" hidden><h2 id="name"></h2><div class="preview-wrap"><img id="preview"></div><div id="tiles" class="grid"></div></section>
</main>
<script>
const OWNER='mateofoulkes-lab',REPO='mattgames';const file=document.querySelector('#file'),drop=document.querySelector('#drop'),work=document.querySelector('#work'),preview=document.querySelector('#preview'),tiles=document.querySelector('#tiles'),nameEl=document.querySelector('#name');
drop.onclick=()=>file.click();file.onchange=()=>file.files[0]&&loadFile(file.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
async function loadFile(f){const url=URL.createObjectURL(f);await processImage(url,f.name.replace(/\.png$/i,''))}
async function processImage(url,base){const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{preview.src=url;nameEl.textContent=base+'.png';work.hidden=false;tiles.innerHTML='';const w=Math.floor(img.naturalWidth/2),h=Math.floor(img.naturalHeight/2);[[0,0],[w,0],[0,h],[w,h]].forEach(([sx,sy],i)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,sx,sy,w,h,0,0,w,h);c.toBlob(blob=>{const u=URL.createObjectURL(blob),card=document.createElement('div');card.className='tile';card.innerHTML=`<img src="${u}"><strong>${base}-${i+1}.jpg</strong><a class="btn" download="${base}-${i+1}.jpg" href="${u}">Descargar JPG</a>`;tiles.appendChild(card)},'image/jpeg',.92)});};img.src=url}
async function loadRepo(){const box=document.querySelector('#repoFiles');try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/portraitspng`),items=await r.json();items.filter(x=>x.name.toLowerCase().endsWith('.png')).forEach(x=>{const b=document.createElement('button');b.textContent=x.name;b.onclick=()=>processImage(x.download_url,x.name.replace(/\.png$/i,''));box.appendChild(b)});if(!box.children.length)box.innerHTML='<span class="muted">Todavía no hay PNGs en portraitspng/.</span>'}catch(e){box.innerHTML='<span class="muted">No se pudo leer la carpeta del repo.</span>'}}loadRepo();
</script></body></html>
