function drawPreview(vx,vy){let lv=state.up.aim||0;if(lv<=0)return;let s=makeShot(vx,vy),pts=[],skip=0;for(let i=0;i<1080&&s.alive;i++){stepShotPhysics(s,fixed,true);if((skip++%7)===0)pts.push({x:s.x,y:s.y})}let shown=Math.ceil(pts.length*Math.min(5,lv)/5);ctx.save();for(let i=0;i<shown;i++){let p=pts[i];glowFill('#fff',8);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}function drawCannon(){let c=cannon(),ang=state.aimVel?Math.atan2(state.aimVel.y,state.aimVel.x):-.28,lv=state.cannonLevel,p=state.aiming?state.aimPower:0,hot=state.aiming&&p>=.82;if(hot){c.x+=rand(-1.7,1.7);c.y+=rand(-1.3,1.3)}let charge=p<.5?'#82ff71':p<.82?'#ffe35c':'#ff526e',accent=hot?'#ff526e':(lv>=2?'#ffe35c':'#67f8ff');ctx.save();ctx.translate(c.x,c.y);glowFill(hot?'#ff526e':'#fff',hot?42:28+lv*5);ctx.beginPath();ctx.arc(0,0,25+lv*2,0,Math.PI*2);ctx.fill();ctx.fillStyle=hot?'#4a050d':'#071018';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);ctx.shadowColor=accent;ctx.shadowBlur=hot?45:28+lv*7;ctx.fillStyle=hot?'#ff526e':(lv>=2?'#101010':'#fff');let bw=65+lv*9,bh=28+lv*3.4;roundRect(-8,-bh/2,bw,bh,14+lv);ctx.fill();ctx.strokeStyle=hot?'#ffd3da':'#fff';ctx.lineWidth=lv>=2?4:2.5;ctx.stroke();if(lv>=1){ctx.strokeStyle=hot?'#fff':(lv>=3?'#aa7cff':'#ffe35c');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,-17);ctx.lineTo(45+lv*4,-17);ctx.stroke();ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(45+lv*4,17);ctx.stroke()}if(state.aiming){let x0=4,y0=-4,w=Math.max(34,bw-20),h=8;ctx.shadowBlur=0;ctx.fillStyle='#020609cc';roundRect(x0,y0,w,h,4);ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=1;ctx.stroke();if(p>0){ctx.fillStyle=charge;ctx.shadowColor=charge;ctx.shadowBlur=12;roundRect(x0+1,y0+1,(w-2)*p,h-2,3);ctx.fill()}ctx.shadowBlur=0;ctx.fillStyle=hot?'#fff':'#071018';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.round(p*100)+'%',x0+w/2,y0+h/2+.5)}ctx.restore();if(state.aiming&&state.aimVel&&state.up.aim>0)drawPreview(state.aimVel.x,state.aimVel.y)}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(state.shake>.1)ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));drawGrid();for(let t of state.trails){ctx.save();ctx.globalAlpha=1-t.life/t.max;glowFill(t.color,10);ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.restore()}for(let w of state.waves){ctx.save();ctx.globalAlpha=.72*(1-w.r/w.max);ctx.strokeStyle=w.color;ctx.shadowColor=w.color;ctx.shadowBlur=24;ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();ctx.restore()}for(let sw of state.sweeps){ctx.save();let a=1-sw.life/sw.max;ctx.globalAlpha=.72*a;ctx.fillStyle=sw.color;ctx.shadowColor=sw.color;ctx.shadowBlur=38;ctx.fillRect(sw.axis==='h'?0:sw.pos-sw.w,sw.axis==='h'?sw.pos-sw.w:0,sw.axis==='h'?W:sw.w*2,sw.axis==='h'?sw.w*2:H);ctx.restore()}for(let b of state.beams){ctx.save();ctx.globalAlpha=1-b.life/b.max;ctx.strokeStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=22;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.restore()}for(let u of state.ufos){ctx.save();ctx.translate(u.x,u.y);ctx.shadowColor='#72ffeb';ctx.shadowBlur=24;ctx.fillStyle='#102b34';ctx.strokeStyle='#baffff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,3,u.r,u.r*.34,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#67f8ff';ctx.beginPath();ctx.arc(0,-5,u.r*.42,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffe35c';ctx.shadowColor='#ffe35c';ctx.shadowBlur=13;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.arc(k*u.r*.28,7,2.5,0,Math.PI*2);ctx.fill()}ctx.restore()}for(let n of state.nodes)if(n.alive)drawNode(n);for(let q of state.specials){ctx.save();let col=q.type==='coin'?'#ffe35c':'#ff5b32',pulseR=1+Math.sin(performance.now()/110)*.08;ctx.translate(q.x,q.y);ctx.rotate(q.type==='bomb'?performance.now()/650:0);ctx.strokeStyle='#fff';ctx.shadowColor=col;ctx.shadowBlur=36;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,q.r*1.42*pulseR,0,Math.PI*2);ctx.stroke();glowFill(col,34);ctx.beginPath();ctx.arc(0,0,q.r*pulseR,0,Math.PI*2);ctx.fill();if(q.type==='bomb'){for(let k=0;k<8;k++){let a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*q.r*1.05,Math.sin(a)*q.r*1.05);ctx.lineTo(Math.cos(a)*q.r*1.5,Math.sin(a)*q.r*1.5);ctx.stroke()}}ctx.fillStyle=q.type==='coin'?'#3a2500':'#fff';ctx.shadowBlur=0;ctx.font=`bold ${q.type==='coin'?28:27}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q.type==='coin'?'$':'✹',0,1);ctx.restore()}for(let p of state.parts){ctx.save();ctx.globalAlpha=1-p.life/p.max;glowFill(p.color,p.kind==='pulse'?18:9);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}if(state.shot?.alive){let s=state.shot,lv=state.cannonLevel,cd=cannonDefs[lv],heavy=cd.heavy,voidy=cd.void;ctx.save();ctx.translate(s.x,s.y);let ang=Math.atan2(s.vy,s.vx);ctx.rotate(ang);glowFill(voidy?'#7f64ff':heavy?'#101010':cd.missile?'#ff9a52':'#fff',heavy?12:30);if(cd.missile){roundRect(-s.r*1.25,-s.r*.62,s.r*2.5,s.r*1.24,s.r*.62);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-s.r*1.15,-s.r*.5);ctx.lineTo(-s.r*1.7,-s.r);ctx.lineTo(-s.r*.7,-s.r*.45);ctx.fill();ctx.beginPath();ctx.moveTo(-s.r*1.15,s.r*.5);ctx.lineTo(-s.r*1.7,s.r);ctx.lineTo(-s.r*.7,s.r*.45);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,s.r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=heavy?28:12;ctx.lineWidth=heavy?4:1.5;ctx.stroke();ctx.restore();if(state.up.orbit){let cnt=state.up.orbit+1,rad=(30+state.up.orbit*7)*lateScale();for(let i=0;i<cnt;i++){let a=performance.now()/260+i*Math.PI*2/cnt;ctx.save();glowFill('#aa7cff',18);ctx.beginPath();ctx.arc(s.x+Math.cos(a)*rad,s.y+Math.sin(a)*rad,5+state.up.orbit,0,Math.PI*2);ctx.fill();ctx.restore()}}}for(let f of state.floaters){ctx.save();ctx.globalAlpha=1-f.life/f.max;ctx.fillStyle=f.c;ctx.shadowColor=f.c;ctx.shadowBlur=8;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.restore()}drawCannon();ctx.restore();if(state.flash>.005){ctx.save();ctx.globalAlpha=state.flash;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore()}}
function loop(now){let dt=Math.min(.03,(now-last)/1000);last=now;acc+=dt;while(acc>=fixed){update(fixed);acc-=fixed}draw();requestAnimationFrame(loop)}spawnSector();msg('CLIC EN EL CAÑÓN · ARRASTRÁ PARA CARGAR Y APUNTAR · SOLTÁ PARA DISPARAR',C.right,4200);requestAnimationFrame(loop)})();</script></body></html>
