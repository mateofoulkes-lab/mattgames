<script>(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2),last=performance.now(),acc=0,audio=null;const fixed=1/120,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C={right:'#67f8ff',left:'#ff4fd8',split2:'#ffe35c',split4:'#82ff71',grow:'#aa7cff',radial:'#ff9a52',link:'#efffff',spawn:'#ffffff',armor2:'#58d5ff',armor3:'#ff7088'},L={right:'→',left:'←',split2:'◇',split4:'✣',grow:'◉',radial:'✺',link:'⌁',spawn:'+4',armor2:'Ⅱ',armor3:'Ⅲ'};
const nodeInfo={right:{name:'IMPULSO DERECHA',desc:'Dispara un pulso hacia la derecha.',unlock:1},left:{name:'IMPULSO IZQUIERDA',desc:'Dispara un pulso hacia la izquierda.',unlock:1},split2:{name:'BIFURCADOR',desc:'Se divide en dos pulsos diagonales.',unlock:3},grow:{name:'ONDA EXPANSIVA',desc:'Genera un círculo que activa nodos cercanos.',unlock:5},split4:{name:'CRUCETA',desc:'Dispara cuatro pulsos en cruz.',unlock:7},radial:{name:'RADIAL',desc:'Explota en ocho direcciones.',unlock:9},armor2:{name:'BLINDADO II',desc:'Resiste 2 impactos. Las esquirlas también le quitan vida.',unlock:11},link:{name:'ENLACE',desc:'Activa los tres nodos vivos más cercanos.',unlock:12},spawn:{name:'GENERADOR +4',desc:'Crea cuatro nodos nuevos.',unlock:15},armor3:{name:'BLINDADO III',desc:'Resiste 3 impactos. Las esquirlas también le quitan vida.',unlock:18}};
const cannonDefs=[{name:'CAÑÓN MK-I',cost:0,minSector:1,power:1,size:1,bounces:1,desc:'Modelo inicial.'},{name:'CAÑÓN MK-II · PRISMA',cost:900,minSector:5,power:1.12,size:1.08,bounces:1,prism:true,desc:'Desbloquea PENETRACIÓN I.'},{name:'CAÑÓN MK-III · MASA',cost:2800,minSector:11,power:1.24,size:1.42,bounces:3,heavy:true,desc:'Desbloquea PENETRACIÓN II.'},{name:'CAÑÓN MK-IV · VACÍO',cost:7000,minSector:18,power:1.36,size:1.5,bounces:3,void:true,desc:'Desbloquea PENETRACIÓN III.'}];
const state={score:0,credits:0,sector:1,shotsLeft:4,shotsMax:4,goal:0,startAlive:0,destroyed:0,chain:0,bestChain:+localStorage.getItem('neoncr_bestChain')||0,shot:null,shotActive:false,aiming:false,aim:null,aimVel:null,nodes:[],parts:[],waves:[],beams:[],trails:[],floaters:[],settle:0,shake:0,flash:0,noteStep:0,lastNodeHit:0,superAwarded:false,levelCleared:false,clearCelebrating:false,cannonLevel:0,up:{power:0,size:0,bounce:0,mult:0,penetration:0},pendingIntro:null,seen:new Set(['right','left'])};
const ui={score:$('score'),credits:$('credits'),creditChip:$('creditChip'),sector:$('sector'),shots:$('shots'),chain:$('chain'),objective:$('objective'),objBar:$('objBar'),objChip:$('objChip'),legend:$('legend'),msg:$('msg'),combo:$('combo'),shop:$('shop'),shopCredits:$('shopCredits'),shopWallet:$('shopWallet'),shopTitle:$('shopTitle'),shopSub:$('shopSub'),upGrid:$('upgradeGrid'),cannonUpgrade:$('cannonUpgrade'),intro:$('intro'),introIcon:$('introIcon'),introTitle:$('introTitle'),introDesc:$('introDesc')};
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function cannon(){return{x:Math.max(62,W*.078),y:H-Math.max(72,H*.115)}}function d2(a,b){let x=a.x-b.x,y=a.y-b.y;return x*x+y*y}
function tone(f=440,d=.05,type='sine',vol=.025,delay=0){try{audio=audio||new(AudioContext||webkitAudioContext)();let when=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,when);g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+d);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+d)}catch(e){}}
function reactionSound(type){let now=performance.now();if(!state.lastNodeHit||now-state.lastNodeHit>500)state.noteStep=0;else state.noteStep++;state.lastNodeHit=now;let f=Math.min(1850,128*Math.pow(2,state.noteStep/12)),wave={right:'square',left:'sawtooth',split2:'triangle',split4:'triangle',grow:'sine',radial:'square',link:'sine',spawn:'triangle',armor2:'square',armor3:'sawtooth'}[type]||'triangle';tone(f,.055,wave,.019);if(type==='grow')tone(f/2,.11,'sine',.011);if(type==='radial'||type==='split4')tone(f*2,.04,'sine',.009,.008);if(type==='link')tone(f*1.5,.06,'triangle',.009,.015)}
function msg(t,c='#fff',ms=900){ui.msg.textContent=t;ui.msg.style.color=c;ui.msg.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>ui.msg.classList.remove('show'),ms)}function burst(x,y,c,n=18,speed=190){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(30,speed);state.parts.push({kind:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1,3),life:0,max:rand(.3,1),color:c})}}function floater(x,y,text,c='#fff'){state.floaters.push({x,y,text,c,life:0,max:.85})}function pulse(x,y,vx,vy,c,p=1,r=5){state.parts.push({kind:'pulse',x,y,vx:vx*p,vy:vy*p,r,life:0,max:3.2,color:c})}
function creditFx(amount,x,y){ui.creditChip.classList.remove('punch');void ui.creditChip.offsetWidth;ui.creditChip.classList.add('punch');let sx=x??ui.creditChip.getBoundingClientRect().left+60,sy=y??30;for(let i=0;i<Math.min(8,2+Math.ceil(amount/3));i++){let p=document.createElement('span');p.className='creditParticle';p.innerHTML=i?'✦':'<span class="coin tinyCoin">$</span> '+amount;p.style.left=sx+'px';p.style.top=sy+'px';p.style.setProperty('--dx',rand(-55,55)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),800)}tone(780,.05,'sine',.018);tone(1180,.04,'sine',.009,.03)}function addCredits(n,x,y){state.credits+=n;creditFx(n,x,y);updateUI()}
function availableTypes(){return Object.keys(nodeInfo).filter(k=>state.sector>=nodeInfo[k].unlock)}function sectorCount(){let area=Math.min(1.2,W*H/850000);return clamp(Math.round((11+state.sector*1.45)*area),10,48)}
function isArmored(type){return type==='armor2'||type==='armor3'}function armorPenetration(type){return type==='armor2'?1:2}function addNode(x,y,type,r=12){let hp=type==='armor2'?2:type==='armor3'?3:1,mul=type==='armor2'?1.5:type==='armor3'?1.9:1;state.nodes.push({x,y,type,r:r*mul,baseR:r*mul,alive:true,triggered:false,pulse:rand(0,6.28),vx:0,vy:0,hp,maxHp:hp,lastDirectHit:-9999,lastChainHit:-9999})}function freeSpot(){let c=cannon(),minX=Math.max(175,W*.2);for(let t=0;t<100;t++){let x=rand(minX,W-55),y=rand(75,H-85);if(Math.hypot(x-c.x,y-c.y)<150)continue;if(state.nodes.every(n=>!n.alive||Math.hypot(x-n.x,y-n.y)>42))return{x,y}}return{x:rand(minX,W-55),y:rand(75,H-85)}}
function newUnlockForSector(){return Object.entries(nodeInfo).find(([k,v])=>v.unlock===state.sector&&!state.seen.has(k))?.[0]||null}function showNodeIntro(type){let inf=nodeInfo[type];ui.introIcon.textContent=L[type];ui.introIcon.style.color='#020609';ui.introIcon.style.background=C[type];ui.introTitle.textContent=inf.name;ui.introDesc.textContent=inf.desc;ui.intro.classList.add('show');state.seen.add(type)}$('introBtn').onclick=()=>ui.intro.classList.remove('show');

function updateAim(e){if(!state.aiming)return;let c=cannon(),dx=e.clientX-c.x,dy=e.clientY-c.y,mag=Math.hypot(dx,dy)||1,max=Math.max(900,W*.72)+state.up.power*95,force=clamp(mag*3.15,220,max);state.aim={x:e.clientX,y:e.clientY};state.aimVel={x:dx/mag*force,y:dy/mag*force}}canvas.addEventListener('pointerdown',e=>{if(ui.shop.classList.contains('show')||ui.intro.classList.contains('show')||state.shotActive||state.clearCelebrating)return;try{audio=audio||new(AudioContext||webkitAudioContext)();audio.resume()}catch(_){}let c=cannon();if(Math.hypot(e.clientX-c.x,e.clientY-c.y)<120){state.aiming=true;canvas.setPointerCapture(e.pointerId);updateAim(e)}});canvas.addEventListener('pointermove',updateAim);canvas.addEventListener('pointerup',e=>{if(!state.aiming)return;updateAim(e);state.aiming=false;if(state.aimVel)shoot(state.aimVel.x,state.aimVel.y);state.aim=null;state.aimVel=null});
function glowFill(c,b=18){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=b}function drawNode(n){let p=1+Math.sin(n.pulse)*.1;ctx.save();glowFill(C[n.type],isArmored(n.type)?32:25);ctx.beginPath();ctx.arc(n.x,n.y,n.r*p,0,Math.PI*2);ctx.fill();if(isArmored(n.type)){ctx.strokeStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();ctx.arc(n.x,n.y,n.r*p+4,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#020609';ctx.shadowBlur=0;ctx.font=`bold ${Math.max(10,n.r*.72)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L[n.type],n.x,n.y+.5);if(isArmored(n.type)){let gap=7,start=n.x-(n.maxHp-1)*gap/2;for(let i=0;i<n.maxHp;i++){ctx.fillStyle=i<n.hp?'#fff':'#162029';ctx.beginPath();ctx.arc(start+i*gap,n.y+n.r*.55,2.2,0,Math.PI*2);ctx.fill()}}ctx.restore()}function drawGrid(){ctx.save();ctx.globalAlpha=.1;ctx.strokeStyle='#17405a';ctx.lineWidth=1;for(let x=(performance.now()*.004)%44;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function drawPreview(vx,vy){let s=makeShot(vx,vy),skip=0;ctx.save();for(let i=0;i<1080&&s.alive;i++){stepShotPhysics(s,fixed,true);if((skip++%7)===0){glowFill('#fff',8);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(s.x,s.y,1.8,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}function drawCannon(){let c=cannon(),ang=state.aimVel?Math.atan2(state.aimVel.y,state.aimVel.x):-.28,lv=state.cannonLevel;ctx.save();ctx.translate(c.x,c.y);glowFill('#fff',28+lv*5);ctx.beginPath();ctx.arc(0,0,25+lv*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071018';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);ctx.shadowColor=lv>=2?'#ffe35c':'#67f8ff';ctx.shadowBlur=28+lv*7;ctx.fillStyle=lv>=2?'#101010':'#fff';roundRect(-8,-14,65+lv*5,28,14);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=lv>=2?4:2.5;ctx.stroke();if(lv>=1){ctx.strokeStyle=lv>=3?'#aa7cff':'#ffe35c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,-17);ctx.lineTo(45+lv*4,-17);ctx.stroke();ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(45+lv*4,17);ctx.stroke()}ctx.restore();if(state.aiming&&state.aimVel){ctx.save();ctx.strokeStyle='#ffe35c';ctx.shadowColor='#ffe35c';ctx.shadowBlur=14;ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(state.aim.x,state.aim.y);ctx.stroke();ctx.setLineDash([]);drawPreview(state.aimVel.x,state.aimVel.y);ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(state.shake>.1)ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));drawGrid();for(let t of state.trails){ctx.save();ctx.globalAlpha=1-t.life/t.max;glowFill(t.color,10);ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.restore()}for(let w of state.waves){ctx.save();ctx.globalAlpha=.72*(1-w.r/w.max);ctx.strokeStyle=w.color;ctx.shadowColor=w.color;ctx.shadowBlur=24;ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();ctx.restore()}for(let b of state.beams){ctx.save();ctx.globalAlpha=1-b.life/b.max;ctx.strokeStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=22;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.restore()}for(let n of state.nodes)if(n.alive)drawNode(n);for(let p of state.parts){ctx.save();ctx.globalAlpha=1-p.life/p.max;glowFill(p.color,p.kind==='pulse'?18:9);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}if(state.shot?.alive){let s=state.shot,lv=state.cannonLevel,heavy=cannonDefs[lv].heavy,voidy=cannonDefs[lv].void;ctx.save();glowFill(voidy?'#7f64ff':heavy?'#101010':'#fff',heavy?12:28);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=heavy?28:12;ctx.lineWidth=heavy?4:1.5;ctx.stroke();ctx.restore()}for(let f of state.floaters){ctx.save();ctx.globalAlpha=1-f.life/f.max;ctx.fillStyle=f.c;ctx.shadowColor=f.c;ctx.shadowBlur=8;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.restore()}drawCannon();ctx.restore();if(state.flash>.005){ctx.save();ctx.globalAlpha=state.flash;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore()}}
function loop(now){let dt=Math.min(.03,(now-last)/1000);last=now;acc+=dt;while(acc>=fixed){update(fixed);acc-=fixed}draw();requestAnimationFrame(loop)}spawnSector();msg('DOS TIPOS. UN CAÑÓN. EMPEZÁ.',C.right,1700);requestAnimationFrame(loop)})();</script></body></html>
