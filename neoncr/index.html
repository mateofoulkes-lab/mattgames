function creditFx(amount,x,y){ui.creditChip.classList.remove('punch');void ui.creditChip.offsetWidth;ui.creditChip.classList.add('punch');let sx=x??ui.creditChip.getBoundingClientRect().left+60,sy=y??30;for(let i=0;i<Math.min(8,2+Math.ceil(amount/3));i++){let p=document.createElement('span');p.className='creditParticle';p.textContent=i?'✦':'+'+amount+' CR';p.style.left=sx+'px';p.style.top=sy+'px';p.style.setProperty('--dx',rand(-55,55)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),800)}tone(780,.05,'sine',.018);tone(1180,.04,'sine',.009,.03)}function addCredits(n,x,y){state.credits+=n;creditFx(n,x,y);updateUI()}

function addNode(x,y,type,r=12){state.nodes.push({x,y,type,r,baseR:r,alive:true,triggered:false,pulse:rand(0,6.28),vx:0,vy:0})}function freeSpot(){let c=cannon(),minX=Math.max(175,W*.2);for(let t=0;t<100;t++){let x=rand(minX,W-55),y=rand(75,H-85);if(Math.hypot(x-c.x,y-c.y)<150)continue;if(state.nodes.every(n=>!n.alive||Math.hypot(x-n.x,y-n.y)>36))return{x,y}}return{x:rand(minX,W-55),y:rand(75,H-85)}}
function newUnlockForSector(){return Object.entries(nodeInfo).find(([k,v])=>v.unlock===state.sector&&!state.seen.has(k))?.[0]||null}function showNodeIntro(type){let inf=nodeInfo[type];ui.introIcon.textContent=L[type];ui.introIcon.style.color=C[type];ui.introIcon.style.background=C[type];ui.introTitle.textContent=inf.name;ui.introDesc.textContent=inf.desc;ui.intro.classList.add('show');state.seen.add(type)}$('introBtn').onclick=()=>ui.intro.classList.remove('show');

function trigger(n,power=1){if(!n.alive||n.triggered)return;n.triggered=true;n.alive=false;state.destroyed++;state.chain++;state.bestChain=Math.max(state.bestChain,state.chain);localStorage.setItem('neoncr_bestChain',state.bestChain);let combo=1+Math.floor(state.chain/7)*.17,amp=1+state.up.mult*.18,gain=Math.round((9+state.chain*1.6)*combo*amp),cr=Math.max(1,Math.round(gain*(.105+state.up.mult*.008)));state.score+=gain;addCredits(cr,n.x,n.y);state.shake=Math.min(12,state.shake+.7+state.chain*.025);state.flash=Math.min(.22,state.flash+.014);burst(n.x,n.y,C[n.type],14+Math.min(25,state.chain));floater(n.x,n.y,'+'+gain,C[n.type]);reactionSound(n.type);if([8,16,28,42].includes(state.chain)){ui.combo.classList.remove('super');ui.combo.textContent=['','','','','','','','','REACCIÓN'][state.chain]||({16:'CASCADE',28:'NEON STORM',42:'CRITICAL MASS'}[state.chain]);ui.combo.textContent+=' ×'+state.chain;ui.combo.style.color=state.chain>=28?C.left:C.right;ui.combo.classList.add('show');clearTimeout(trigger.ct);trigger.ct=setTimeout(()=>ui.combo.classList.remove('show'),500)}let v=210+state.up.power*16;if(n.type==='right')pulse(n.x,n.y,v,0,C.right,power);if(n.type==='left')pulse(n.x,n.y,-v,0,C.left,power);if(n.type==='split2')for(let a of[-.55,.55])pulse(n.x,n.y,Math.cos(a)*195,Math.sin(a)*195,C.split2,power);if(n.type==='split4')for(let i=0;i<4;i++){let a=i*Math.PI/2;pulse(n.x,n.y,Math.cos(a)*190,Math.sin(a)*190,C.split4,power)}if(n.type==='grow')state.waves.push({x:n.x,y:n.y,r:n.r,prev:n.r,max:n.r*10.2,speed:220,life:0,color:C.grow});if(n.type==='radial')for(let i=0;i<8;i++){let a=i*Math.PI/4;pulse(n.x,n.y,Math.cos(a)*180,Math.sin(a)*180,C.radial,power,.95)}if(n.type==='link'){let qs=state.nodes.filter(q=>q.alive).sort((a,b)=>d2(n,a)-d2(n,b)).slice(0,3);for(let q of qs){state.beams.push({x1:n.x,y1:n.y,x2:q.x,y2:q.y,color:'#fff',life:0,max:.24});setTimeout(()=>q.alive&&trigger(q,.92),55)}}if(n.type==='spawn')spawnFour(n);if(!state.nodes.some(q=>q.alive))superBonus();updateUI()}
function superBonus(){if(state.superAwarded)return;state.superAwarded=true;let bonus=280+state.sector*70+state.shotsLeft*65+Math.min(450,state.chain*7);state.score+=bonus*10;addCredits(bonus,W*.5,H*.4);ui.combo.classList.add('super','show');ui.combo.textContent='SUPER BONUS\n+'+bonus+' CR';clearTimeout(trigger.ct);trigger.ct=setTimeout(()=>ui.combo.classList.remove('show','super'),1800);state.flash=.8;state.shake=22;for(let i=0;i<5;i++)setTimeout(()=>burst(rand(W*.2,W*.8),rand(H*.2,H*.7),i%2?'#ffe35c':'#fff',38,340),i*80);[261.6,329.6,392,523.2].forEach((f,i)=>tone(f,.28,'sine',.03,i*.05))}
function hitNodes(obj,extra=0){for(let n of state.nodes){if(!n.alive)continue;let rr=obj.r+n.r+extra;if(d2(obj,n)<=rr*rr){trigger(n);if(obj===state.shot&&!obj.didImpact)primaryImpact(obj)}}}function primaryImpact(s){s.didImpact=true;let cd=cannonDefs[state.cannonLevel];if(cd.prism)for(let a of[-.42,0,.42]){let ca=Math.cos(a),sa=Math.sin(a);pulse(s.x,s.y,s.vx*.75*ca-s.vy*.75*sa,s.vx*.75*sa+s.vy*.75*ca,'#fff',1,6)}if(cd.heavy)state.waves.push({x:s.x,y:s.y,r:s.r,prev:s.r,max:s.r*4.5,speed:235,life:0,color:'#ffe35c'})}
function shoot(vx,vy){let c=cannon(),cd=cannonDefs[state.cannonLevel],r=(11+state.up.size*1.7)*cd.size;state.shot={x:c.x+38,y:c.y-8,vx:vx*cd.power,vy:vy*cd.power,r,life:0,bounces:cd.bounces+state.up.bounce,alive:true,didImpact:false};state.shotActive=true;state.chain=0;state.noteStep=0;state.lastNodeHit=0;state.settle=0;state.shotsLeft--;updateUI();tone(88,.13,'sawtooth',.045)}function killShot(s){if(!s.alive)return;s.alive=false;let cd=cannonDefs[state.cannonLevel];if(cd.void)state.waves.push({x:s.x,y:s.y,r:8,prev:8,max:120+state.up.size*10,speed:245,life:0,color:'#7f64ff'});burst(s.x,s.y,'#fff',12)}
function update(dt){for(let n of state.nodes){n.pulse+=dt*3;if(n.alive&&(Math.abs(n.vx)+Math.abs(n.vy)>.02)){n.x+=n.vx*dt;n.y+=n.vy*dt;n.vx*=Math.pow(.08,dt);n.vy*=Math.pow(.08,dt)}}let s=state.shot;if(s?.alive){s.life+=dt;s.vy+=390*dt;let cd=cannonDefs[state.cannonLevel];if(cd.void)for(let n of state.nodes){if(!n.alive)continue;let dx=s.x-n.x,dy=s.y-n.y,d=Math.hypot(dx,dy)||1;if(d<165){let f=(1-d/165)*100;n.vx+=dx/d*f*dt;n.vy+=dy/d*f*dt}}s.x+=s.vx*dt;s.y+=s.vy*dt;state.trails.push({x:s.x,y:s.y,life:0,max:.42,r:s.r*.18,color:cd.void?'#7f64ff':'#fff'});hitNodes(s);if(s.x+s.r>W||s.x-s.r<0){if(s.bounces>0){s.vx*=-.72;s.x=clamp(s.x,s.r,W-s.r);s.bounces--;tone(120,.035,'square',.018)}else killShot(s)}if(s.y+s.r>H){if(s.bounces>0){s.vy*=-.63;s.y=H-s.r;s.bounces--;tone(105,.04,'square',.018)}else killShot(s)}if(s.y<-120||s.life>9)killShot(s)}for(let p of state.parts){p.life+=dt;if(p.kind==='spark'){p.vx*=Math.pow(.07,dt);p.vy*=Math.pow(.07,dt);p.vy+=60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}else{p.x+=p.vx*dt;p.y+=p.vy*dt;hitNodes(p,2);if(p.x<-70||p.x>W+70||p.y<-70||p.y>H+70)p.life=p.max}}state.parts=state.parts.filter(p=>p.life<p.max);for(let w of state.waves){w.life+=dt;w.prev=w.r;w.r=Math.min(w.max,w.r+w.speed*dt);for(let n of state.nodes){if(!n.alive)continue;let d=Math.hypot(n.x-w.x,n.y-w.y);if(d<=w.r+n.r&&d>=w.prev-n.r-10)trigger(n,.95)}}state.waves=state.waves.filter(w=>w.r<w.max||w.life<.3);for(let b of state.beams)b.life+=dt;state.beams=state.beams.filter(b=>b.life<b.max);for(let t of state.trails)t.life+=dt;state.trails=state.trails.filter(t=>t.life<t.max);for(let f of state.floaters){f.life+=dt;f.y-=25*dt}state.floaters=state.floaters.filter(f=>f.life<f.max);state.shake*=Math.pow(.02,dt);state.flash*=Math.pow(.008,dt);let active=state.shot?.alive||state.parts.some(p=>p.kind==='pulse')||state.waves.length||state.beams.length;if(state.shotActive&&!active){state.settle+=dt;if(state.settle>.5)endTurn()}else if(active)state.settle=0;updateUI()}
function endTurn(){state.shotActive=false;state.shot=null;let success=state.destroyed>=state.goal;if(success){let bonus=30+state.sector*10+state.shotsLeft*16;addCredits(bonus);openShop('success');return}if(state.shotsLeft<=0){openShop('retry');return}openShop('turn')}
const adjustments=[{k:'power',name:'BOBINA DE IMPULSO',desc:'Aumenta la velocidad máxima del disparo.',base:35,max:5},{k:'size',name:'CALIBRE',desc:'Aumenta ligeramente el tamaño del proyectil.',base:45,max:4},{k:'bounce',name:'RECUPERADOR',desc:'Añade un rebote adicional.',base:65,max:3},{k:'mult',name:'AMPLIFICADOR CR',desc:'Mejora puntos y créditos obtenidos.',base:80,max:4}];function cost(u){return Math.round(u.base*Math.pow(1.72,state.up[u.k]))}
function openShop(mode){ui.shop.dataset.mode=mode;ui.shop.classList.add('show');ui.shopTitle.textContent=mode==='success'?'SECTOR '+state.sector+' COMPLETADO':mode==='retry'?'RECALIBRACIÓN':'TALLER DEL CAÑÓN';ui.shopSub.textContent=mode==='success'?'Seguí limpiando sectores y acumulando CR. El cañón es tu gran progresión.':mode==='retry'?'No llegaste al objetivo. Conservás todos los créditos y mejoras.':'Podés ajustar componentes o ahorrar para evolucionar el cañón completo.';renderShop()}
function renderShop(){ui.shopCredits.textContent=state.credits;ui.bestChain.textContent=state.bestChain;let cur=cannonDefs[state.cannonLevel],next=cannonDefs[state.cannonLevel+1];if(next){let can=state.credits>=next.cost;ui.cannonUpgrade.disabled=!can;ui.cannonUpgrade.className='cannonUpgrade'+(can?' ready':'');ui.cannonUpgrade.innerHTML=`<div class="newTag">MEJORAR EL CAÑÓN</div><div class="cannonName">${cur.name} → ${next.name}</div><div class="cannonStats">${next.desc}</div><div class="cc">${next.cost} CR ${can?'· ¡LISTO PARA EVOLUCIONAR!':''}</div>`;ui.cannonUpgrade.onclick=()=>upgradeCannon(next)}else{ui.cannonUpgrade.disabled=true;ui.cannonUpgrade.className='cannonUpgrade';ui.cannonUpgrade.innerHTML=`<div class="newTag">CAÑÓN MÁXIMO</div><div class="cannonName">${cur.name}</div><div class="cannonStats">Has alcanzado la evolución máxima actual.</div>`}ui.upGrid.innerHTML='';for(let u of adjustments){let lv=state.up[u.k],c=cost(u),b=document.createElement('button');b.className='card';b.disabled=lv>=u.max||state.credits<c;b.innerHTML=`<div class="ct">${u.name} · ${lv}/${u.max}</div><div class="cd">${u.desc}</div><div class="cc">${lv>=u.max?'MÁXIMO':c+' CR'}</div>`;b.onclick=()=>{if(state.credits>=c){state.credits-=c;state.up[u.k]++;tone(520,.06,'triangle',.025);renderShop();updateUI()}};ui.upGrid.appendChild(b)}}
function upgradeCannon(next){state.credits-=next.cost;state.cannonLevel++;ui.shop.classList.remove('show');updateUI();let ub=$('upgradeBurst');$('upgradeBurstText').textContent='¡'+next.name+'!';ub.classList.remove('show');void ub.offsetWidth;ub.classList.add('show');state.shake=28;state.flash=.95;for(let i=0;i<7;i++)setTimeout(()=>burst(rand(W*.2,W*.8),rand(H*.2,H*.75),i%2?'#ffe35c':'#67f8ff',40,390),i*65);[130.8,164.8,196,261.6,329.6,392,523.2].forEach((f,i)=>tone(f,.22,i<3?'sawtooth':'triangle',.032,i*.055));setTimeout(()=>{ub.classList.remove('show');ui.shop.classList.add('show');renderShop()},1150)}
$('continueBtn').onclick=()=>{let mode=ui.shop.dataset.mode;ui.shop.classList.remove('show');state.chain=0;if(mode==='success'){state.sector++;spawnSector()}else if(mode==='retry')spawnSector();else msg('SIGUIENTE TIRO',C.right)};
function updateUI(){ui.score.textContent=state.score.toLocaleString('es-AR');ui.credits.textContent=state.credits;ui.shopCredits.textContent=state.credits;ui.sector.textContent=state.sector;ui.shots.textContent=state.shotsLeft;ui.chain.textContent=state.chain;ui.objective.textContent=state.destroyed+'/'+state.goal;ui.objBar.style.width=(state.goal?Math.min(100,state.destroyed/state.goal*100):0)+'%';ui.objChip.classList.toggle('good',state.destroyed>=state.goal);ui.shots.parentElement.classList.toggle('danger',state.shotsLeft<=1)}
function updateAim(e){if(!state.aiming)return;let c=cannon(),dx=e.clientX-c.x,dy=e.clientY-c.y,mag=Math.hypot(dx,dy)||1,max=Math.max(900,W*.72)+state.up.power*95,force=clamp(mag*3.15,220,max);state.aim={x:e.clientX,y:e.clientY};state.aimVel={x:dx/mag*force,y:dy/mag*force}}canvas.addEventListener('pointerdown',e=>{if(ui.shop.classList.contains('show')||ui.intro.classList.contains('show')||state.shotActive)return;try{audio=audio||new(AudioContext||webkitAudioContext)();audio.resume()}catch(_){}let c=cannon();if(Math.hypot(e.clientX-c.x,e.clientY-c.y)<120){state.aiming=true;canvas.setPointerCapture(e.pointerId);updateAim(e)}});canvas.addEventListener('pointermove',updateAim);canvas.addEventListener('pointerup',e=>{if(!state.aiming)return;updateAim(e);state.aiming=false;if(state.aimVel)shoot(state.aimVel.x,state.aimVel.y);state.aim=null;state.aimVel=null});
function glowFill(c,b=18){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=b}function drawNode(n){let p=1+Math.sin(n.pulse)*.1;ctx.save();glowFill(C[n.type],25);ctx.beginPath();ctx.arc(n.x,n.y,n.r*p,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020609';ctx.shadowBlur=0;ctx.font=`bold ${Math.max(10,n.r*.9)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L[n.type],n.x,n.y+.5);ctx.restore()}function drawGrid(){ctx.save();ctx.globalAlpha=.1;ctx.strokeStyle='#17405a';ctx.lineWidth=1;for(let x=(performance.now()*.004)%44;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}function drawCannon(){let c=cannon(),ang=state.aimVel?Math.atan2(state.aimVel.y,state.aimVel.x):-.28,lv=state.cannonLevel;ctx.save();ctx.translate(c.x,c.y);glowFill('#fff',28+lv*5);ctx.beginPath();ctx.arc(0,0,25+lv*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071018';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);ctx.shadowColor=lv>=2?'#ffe35c':'#67f8ff';ctx.shadowBlur=28+lv*7;ctx.fillStyle=lv>=2?'#101010':'#fff';roundRect(-8,-14,65+lv*5,28,14);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=lv>=2?4:2.5;ctx.stroke();if(lv>=1){ctx.strokeStyle=lv>=3?'#aa7cff':'#ffe35c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,-17);ctx.lineTo(45+lv*4,-17);ctx.stroke();ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(45+lv*4,17);ctx.stroke()}ctx.restore();if(state.aiming&&state.aimVel){ctx.save();ctx.strokeStyle='#ffe35c';ctx.shadowColor='#ffe35c';ctx.shadowBlur=14;ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(state.aim.x,state.aim.y);ctx.stroke();ctx.setLineDash([]);let g=390;for(let i=0;i<44;i++){let t=i*.055,x=c.x+Math.cos(ang)*55+state.aimVel.x*cannonDefs[lv].power*t,y=c.y+Math.sin(ang)*55+state.aimVel.y*cannonDefs[lv].power*t+.5*g*t*t;if(x>W+20||y>H+20)break;glowFill('#fff',8);ctx.beginPath();ctx.arc(x,y,1.7,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(state.shake>.1)ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));drawGrid();for(let t of state.trails){ctx.save();ctx.globalAlpha=1-t.life/t.max;glowFill(t.color,10);ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.restore()}for(let w of state.waves){ctx.save();ctx.globalAlpha=.72*(1-w.r/w.max);ctx.strokeStyle=w.color;ctx.shadowColor=w.color;ctx.shadowBlur=24;ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();ctx.restore()}for(let b of state.beams){ctx.save();ctx.globalAlpha=1-b.life/b.max;ctx.strokeStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=22;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.restore()}for(let n of state.nodes)if(n.alive)drawNode(n);for(let p of state.parts){ctx.save();ctx.globalAlpha=1-p.life/p.max;glowFill(p.color,p.kind==='pulse'?18:9);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}if(state.shot?.alive){let s=state.shot,lv=state.cannonLevel,heavy=cannonDefs[lv].heavy,voidy=cannonDefs[lv].void;ctx.save();glowFill(voidy?'#7f64ff':heavy?'#101010':'#fff',heavy?12:28);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=heavy?28:12;ctx.lineWidth=heavy?4:1.5;ctx.stroke();ctx.restore()}for(let f of state.floaters){ctx.save();ctx.globalAlpha=1-f.life/f.max;ctx.fillStyle=f.c;ctx.shadowColor=f.c;ctx.shadowBlur=8;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.restore()}drawCannon();ctx.restore();if(state.flash>.005){ctx.save();ctx.globalAlpha=state.flash;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore()}}
function loop(now){let dt=Math.min(.03,(now-last)/1000);last=now;acc+=dt;while(acc>=fixed){update(fixed);acc-=fixed}draw();requestAnimationFrame(loop)}spawnSector();msg('DOS TIPOS. UN CAÑÓN. EMPEZÁ.',C.right,1700);requestAnimationFrame(loop)})();</script></body></html>
