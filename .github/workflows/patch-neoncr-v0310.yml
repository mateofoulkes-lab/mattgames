name: Patch NEON v0.3.10
on:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v0310.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NEON shop and currency UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('neoncr/index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
            '<title>NEON//CR</title>':'<title>NEON</title>',
            '.section{font-size:9px;letter-spacing:.16em;margin:12px 0 6px':'.section{font-size:9px;letter-spacing:.16em;margin:10px 0 5px',
            '.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}':'.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}',
            'border-radius:12px;padding:8px 10px;min-height:94px':'border-radius:12px;padding:7px 10px;min-height:88px',
            '.prog{display:flex;gap:5px;align-items:center;grid-column:2/4;grid-row:3;min-height:14px}':'.prog{display:flex;gap:5px;align-items:center;grid-column:2/4;grid-row:3;min-height:12px}',
            '.foot{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}':'.foot{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}',
            '.card{min-height:78px;padding:7px 9px}':'.card{min-height:72px;padding:6px 9px}',
            '<div class="chip brand">NEON//CR</div>':'<div class="chip brand">NEON</div>',
            '<div id="creditChip" class="chip creditChip">CR <b id="credits" class="creditNum">0</b></div>':'<div id="creditChip" class="chip creditChip"><span class="coin">$</span><b id="credits" class="creditNum">0</b></div>',
            '<div id="shopWallet" class="shopWallet"><div class="walletLabel">CRÉDITOS</div><b id="shopCredits" class="walletNumber">0</b></div>':'<div id="shopWallet" class="shopWallet"><span class="coin walletCoin">$</span><b id="shopCredits" class="walletNumber">0</b></div>',
            '<div class="version">v0.3.9</div>':'<div class="version">v0.3.10</div>',
            "p.textContent=i?'✦':'+'+amount+' CR'":"p.innerHTML=i?'✦':'<span class=\"coin tinyCoin\">$</span> '+amount",
            "ui.combo.textContent='¡NIVEL SUPERADO!\\n+'+bonus+' CR'":"ui.combo.innerHTML='¡NIVEL SUPERADO!<br><span class=\"coin clearCoin\">$</span> '+bonus",
            "{k:'mult',name:'CRÉDITOS',desc:'Ganás más CR.'":"{k:'mult',name:'GANANCIA',desc:'Ganás más monedas.'",
            "'<span class=\"cannonLock\">FALTAN '+(next.cost-state.credits)+' CR</span>'":"'<span class=\"cannonLock\">FALTAN <span class=\"coin tinyCoin\">$</span> '+(next.cost-state.credits)+'</span>'",
            "<span class=\"cannonCost\">${next.cost} CR</span>":"<span class=\"cannonCost\"><span class=\"coin\">$</span> ${next.cost}</span>",
            "c+' CR'":"'<span class=\"coin tinyCoin\">$</span> '+c"
          }
          for a,b in reps.items():
            if a not in s:
              print('WARN missing:', a[:90])
            s = s.replace(a,b)
          marker = '.creditNum{display:inline-block;font-size:19px;'
          coin_css = '.coin{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;margin-right:5px;background:radial-gradient(circle at 35% 30%,#fff4a5 0,#ffd54a 35%,#d99400 72%,#865600 100%);border:1px solid #fff1a0;color:#3a2500;font-weight:1000;font-size:12px;line-height:1;box-shadow:0 0 9px #ffd84a88,inset 0 1px 0 #fff8c5;vertical-align:middle}.walletCoin{width:28px;height:28px;font-size:18px;margin:0 7px 0 0}.tinyCoin{width:13px;height:13px;font-size:9px;margin-right:3px;box-shadow:0 0 5px #ffd84a66}.clearCoin{width:.72em;height:.72em;font-size:.5em;margin-right:.12em;vertical-align:.08em}.shopWallet{display:flex;align-items:center;justify-content:center}'
          if coin_css not in s:
            s = s.replace(marker, coin_css + marker)
          # Ensure no visible currency words remain while leaving internal JS identifiers intact.
          s = s.replace(' CR</', ' </').replace(' CR<', ' <')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git diff --cached --quiet || git commit -m "Compact NEON shop and replace CR with coin UI"
          git push
