name: Patch NEON v0.4.5
on:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v045.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact HUD to left
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('neoncr/index.html')
          s=p.read_text()
          s=s.replace('v0.4.4','v0.4.5')
          s=s.replace('<div class="chip brand">NEON</div>','<div class="chip brand brandStack"><span>NEON</span><span>BALLS</span></div>',1)
          css='''<style id="v045-hud-compact">
          .hud{padding:8px}
          .hudTop{width:max-content;max-width:calc(100vw - 16px);display:grid;grid-template-columns:auto auto auto auto;gap:12px;align-items:stretch;justify-content:start}
          .hudLeft{display:flex;gap:8px;align-items:stretch;width:auto}
          .brandStack{min-width:47px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;line-height:1;flex:0 0 auto}
          .brandStack span:first-child{color:#67f8ff}
          .brandStack span:last-child{color:#ff7088;letter-spacing:.08em;font-size:9px}
          .creditChip{width:118px;min-width:118px;height:auto;flex:0 0 118px}
          .sectorBlock{width:88px;min-width:88px;flex:0 0 88px}
          .shotsBlock{width:242px;min-width:242px;max-width:242px;flex:0 0 242px}
          .objectiveBlock{width:116px;min-width:116px;flex:0 0 116px}
          .legend{left:8px;top:79px}
          @media(max-width:760px){
            .hudTop{width:100%;max-width:none;grid-template-columns:auto auto minmax(190px,242px);gap:7px;align-items:stretch}
            .hudLeft{grid-column:auto;min-width:0}
            .creditChip{width:104px;min-width:104px;flex-basis:104px}
            .sectorBlock{grid-column:auto;grid-row:auto;width:76px;min-width:76px}
            .shotsBlock{grid-column:auto;grid-row:auto;width:auto;min-width:190px;max-width:242px}
            .objectiveBlock{display:none}
            .legend{top:72px}
          }
          @media(max-width:560px){
            .hudTop{grid-template-columns:auto auto;gap:6px}
            .hudLeft{grid-column:1/3}
            .sectorBlock{grid-column:1;grid-row:2}
            .shotsBlock{grid-column:2;grid-row:2;min-width:0;width:220px}
            .legend{top:126px}
          }
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('neoncr/index.html').read_text()
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/neon-v045.js').write_text(js)
          subprocess.run(['node','--check','/tmp/neon-v045.js'],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git commit -m "Compact HUD to match left-aligned layout"
          git push
