name: Fix El Topo v0.10.11 cache
on:
  push:
    paths:
      - '.github/workflows/fix-v01011-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('eltopo/index.html')
          s=p.read_text(encoding='utf-8').replace('v=0.10.10','v=0.10.11')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: node --check eltopo/social-game.js
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/fix-v01011-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bust El Topo v0.10.11 asset cache' || exit 0
          git push
