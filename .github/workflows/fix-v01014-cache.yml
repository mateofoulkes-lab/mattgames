name: Fix El Topo v0.10.14 cache alignment
on:
  push:
    paths:
      - '.github/workflows/fix-v01014-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align all El Topo asset versions
        run: python -c "from pathlib import Path; p=Path('eltopo/social-game.js'); s=p.read_text(encoding='utf-8').replace('?v=0.10.11','?v=0.10.14').replace('?v=0.10.12','?v=0.10.14').replace(\"const VERSION = '0.10.13';\",\"const VERSION = '0.10.14';\"); p.write_text(s,encoding='utf-8'); h=Path('eltopo/index.html'); hx=h.read_text(encoding='utf-8').replace('?v=0.10.11','?v=0.10.14').replace('?v=0.10.12','?v=0.10.14').replace('?v=0.10.13','?v=0.10.14').replace('v0.10.13','v0.10.14'); h.write_text(hx,encoding='utf-8'); m=Path('eltopo/mixed-avatar-sync.js'); mx=m.read_text(encoding='utf-8').replace(\"const BUILD_VERSION = '0.10.13';\",\"const BUILD_VERSION = '0.10.14';\"); m.write_text(mx,encoding='utf-8')"
      - name: Validate versions and JavaScript
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
          grep -q "const VERSION = '0.10.14'" eltopo/social-game.js
          grep -q "game-data.js?v=0.10.14" eltopo/social-game.js
          grep -q "social-game.js?v=0.10.14" eltopo/index.html
          grep -q "mixed-avatar-sync.js?v=0.10.14" eltopo/index.html
          grep -q "social.css?v=0.10.14" eltopo/index.html
          grep -q "const BUILD_VERSION = '0.10.14'" eltopo/mixed-avatar-sync.js
          if grep -q 'SP_LOCATIONS' eltopo/social-game.js; then exit 1; fi
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/fix-v01014-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align El Topo v0.10.14 assets and Spyfall final flow' || exit 0
          git push