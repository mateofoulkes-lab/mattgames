name: Fix El Topo v0.10.8 cache

on:
  push:
    paths:
      - 'eltopo/tools/fix_v0108_cache.py'
      - '.github/workflows/fix-v0108-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python eltopo/tools/fix_v0108_cache.py
      - run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
      - run: rm -f eltopo/tools/fix_v0108_cache.py .github/workflows/fix-v0108-cache.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bust El Topo v0.10.8 asset cache'
          git push
