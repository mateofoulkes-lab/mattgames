name: Patch NEON v0.4.2b
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v042b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch aiming progression and 3-column shop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('neoncr/index.html')
          s=p.read_text()
          def rep(old,new,label,count=1):
              global s
              if old not in s: raise SystemExit(label+' not found')
              s=s.replace(old,new,count)

          rep('v0.4.1','v0.4.2','version')
          rep('(state.sector<7?4:state.sector<14?5:6)+state.up.shots','(state.sector<7?5:state.sector<14?6:7)+state.up.shots','shots')
          rep('up:{power:0','up:{aim:0,power:0','state')
          rep("const icons={power:","const icons={aim:'<svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"12\"/><path d=\"M20 4v7M20 29v7M4 20h7M29 20h7\"/><circle cx=\"20\" cy=\"20\" r=\"3\"/></svg>',power:",'icons')
          rep("const adjustments=[{tab:'cannon',k:'power'","const adjustments=[{tab:'cannon',k:'aim',name:'MIRA',desc:'Revela 20% más de la trayectoria.',prices:[5,10,15,25,50],max:5,color:'#efffff'},{tab:'cannon',k:'power'",'adjustment')
          rep("function cost(u){return Math.round(u.base*Math.pow(u.factor||1.95,state.up[u.k]))}","function cost(u){let lv=state.up[u.k];return u.prices?(u.prices[lv]??u.prices[u.prices.length-1]):Math.round(u.base*Math.pow(u.factor||1.95,lv))}",'cost')
          oldprev="function drawPreview(vx,vy){let s=makeShot(vx,vy),skip=0;ctx.save();for(let i=0;i<1080&&s.alive;i++){stepShotPhysics(s,fixed,true);if((skip++%7)===0){glowFill('#fff',8);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(s.x,s.y,1.8,0,Math.PI*2);ctx.fill()}}ctx.restore()}"
          newprev="function drawPreview(vx,vy){let lv=state.up.aim||0;if(lv<=0)return;let s=makeShot(vx,vy),pts=[],skip=0;for(let i=0;i<1080&&s.alive;i++){stepShotPhysics(s,fixed,true);if((skip++%7)===0)pts.push({x:s.x,y:s.y})}let shown=Math.ceil(pts.length*Math.min(5,lv)/5);ctx.save();for(let i=0;i<shown;i++){let p=pts[i];glowFill('#fff',8);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}ctx.restore()}"
          rep(oldprev,newprev,'preview')
          rep('if(state.aiming&&state.aimVel){ctx.save();ctx.strokeStyle=\'#ffe35c\';','if(state.aiming&&state.aimVel&&state.up.aim>0){ctx.save();ctx.strokeStyle=\'#ffe35c\';','aim gate')
          css='''<style id="v042-shop-grid">#shop .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}#shop .card{min-height:68px;padding:4px 6px;grid-template-columns:34px minmax(0,1fr) auto;gap:1px 5px;border-radius:10px}#shop .upgradeIcon{width:34px;height:34px;border-radius:9px}#shop .upgradeIcon svg{width:23px;height:23px}#shop .ct,#shop .cc{font-size:9px}#shop .cd{font-size:7px}#shop .prog{gap:4px;min-height:10px}#shop .pip{width:8px;height:8px}@media(max-width:700px){#shop .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:470px){#shop .grid{grid-template-columns:1fr}}</style>'''
          if 'id="v042-shop-grid"' not in s: s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('neoncr/index.html').read_text(); js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)); Path('/tmp/neon-v042.js').write_text(js); subprocess.run(['node','--check','/tmp/neon-v042.js'],check=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git commit -m "Add progressive aim upgrade and extra base shot"
          git push
