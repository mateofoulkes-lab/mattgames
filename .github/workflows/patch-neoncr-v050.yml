name: Patch NEON v0.5.0
on:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v050.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten mobile HUD and remove node legend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('neoncr/index.html')
          s=p.read_text()
          s=s.replace('v0.4.9','v0.5.0')
          css='''<style id="v050-mobile-hud">
          /* The old node-type dropdown is no longer part of the HUD. */
          .legend{display:none!important}

          /* Keep the four primary status cards visually equal. */
          .hudTop{align-items:stretch}
          .hudLeft{align-items:stretch}
          .hudLeft>.brand,.hudLeft>.creditChip,.sectorBlock,.shotsBlock{height:57px;min-height:57px;margin:0}
          .hudLeft>.brand{display:flex;flex-direction:column;justify-content:center}
          .hudLeft>.creditChip{display:flex;align-items:center;justify-content:center}

          @media(max-width:760px){
            .hud{padding:8px 7px}
            .hudTop{display:flex!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:flex-start!important;gap:5px!important;width:100%;overflow:visible}
            .hudLeft{display:contents!important}
            .hudLeft>.brand,.hudLeft>.creditChip,.sectorBlock,.shotsBlock{height:56px!important;min-height:56px!important;flex:none!important}
            .hudLeft>.brand{width:72px!important;min-width:72px!important;padding:5px 7px!important;font-size:10px!important;letter-spacing:.14em!important;align-items:flex-start!important}
            .hudLeft>.creditChip{width:96px!important;min-width:96px!important;padding:5px 6px!important}
            .creditNum{font-size:18px!important}
            .creditChip .coin{width:20px;height:20px;font-size:13px}
            .sectorBlock{width:62px!important;min-width:62px!important;padding:4px 5px!important;border-radius:10px!important}
            .sectorBlock #sector{font-size:25px!important}
            .shotsBlock{width:152px!important;min-width:152px!important;padding:4px 6px!important;border-radius:10px!important}
            .shotsBlock .hudLabel{font-size:6.5px!important;letter-spacing:.11em!important;white-space:nowrap;margin-bottom:5px!important}
            .shotDots{gap:4px!important;min-height:16px!important}
            .shotDot{width:12px!important;height:12px!important}
            .objectiveBlock{display:none!important}
          }

          @media(max-width:430px){
            .hudTop{gap:4px!important}
            .hudLeft>.brand{width:64px!important;min-width:64px!important;font-size:9px!important}
            .hudLeft>.creditChip{width:88px!important;min-width:88px!important}
            .sectorBlock{width:58px!important;min-width:58px!important}
            .shotsBlock{width:142px!important;min-width:142px!important}
            .shotDots{gap:3px!important}
          }

          @media(max-width:390px){
            .hud{padding-left:5px;padding-right:5px}
            .hudTop{gap:3px!important}
            .hudLeft>.brand{width:60px!important;min-width:60px!important;padding-left:5px!important;padding-right:5px!important}
            .hudLeft>.creditChip{width:82px!important;min-width:82px!important}
            .sectorBlock{width:54px!important;min-width:54px!important}
            .shotsBlock{width:137px!important;min-width:137px!important}
            .shotDot{width:11px!important;height:11px!important}
          }
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('neoncr/index.html').read_text()
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/neon-v050.js').write_text(js)
          subprocess.run(['node','--check','/tmp/neon-v050.js'],check=True)
          assert 'v0.5.0' in s
          assert '.legend{display:none!important}' in s
          assert '.hudLeft{display:contents!important}' in s
          PY
      - name: Commit
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git commit -m "Fit mobile HUD in one row and remove node legend"
          git push
