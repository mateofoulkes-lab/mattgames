name: Apply A-WARE house layout v0.22
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-aware-house-layout-v022.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch A-WARE house layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('a-ware/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('A-WARE v0.21 · POINT-CLOUD PROTOTYPE','A-WARE v0.22 · POINT-CLOUD PROTOTYPE')

          anchor="function normalizeObject(obj,height=2){obj.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(obj);const s=height/Math.max(.001,b.max.y-b.min.y);obj.scale.multiplyScalar(s);obj.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(obj);obj.position.y-=b2.min.y;obj.updateMatrixWorld(true);return obj;}"
          proc="""function proceduralObject(file){const q=new THREE.Group();const box=(e,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(...e),new THREE.MeshBasicMaterial());m.position.set(...p);q.add(m)};if(file==='cama.glb'){box([2,.18,1],[0,.28,0]);box([1.92,.26,.95],[0,.5,0]);box([.55,.16,.72],[-.62,.72,0]);box([.12,.95,1.1],[-1.02,.72,0]);for(const x of[-.86,.86])for(const z of[-.38,.38])box([.12,.38,.12],[x,.1,z])}else if(file==='mesadenoche.glb'){box([.58,.68,.52],[0,.4,0]);box([.66,.08,.6],[0,.78,0]);box([.5,.18,.03],[0,.52,.275]);box([.16,.05,.05],[0,.52,.315]);for(const x of[-.23,.23])for(const z of[-.2,.2])box([.08,.22,.08],[x,.11,z])}else if(file==='doorway.glb'){box([.14,2.2,.18],[-.57,1.1,0]);box([.14,2.2,.18],[.57,1.1,0]);box([1.28,.14,.18],[0,2.13,0])}return q;}"""
          if proc not in s:
              if anchor not in s: raise SystemExit('normalize anchor missing')
              s=s.replace(anchor,anchor+proc)

          old="async function loadStatic(file,pos,rotation,color,height,scale=[1,1,1]){try{let obj;if(file.toLowerCase().endsWith('.glb'))obj=(await new GLTFLoader().loadAsync(A+file)).scene;else obj=await new FBXLoader().loadAsync(A+file);normalizeObject(obj,height);obj.scale.x*=scale[0];obj.scale.y*=scale[1];obj.scale.z*=scale[2];obj.position.set(pos[0],pos[1],pos[2]);if(Array.isArray(rotation))obj.rotation.set(rotation[0]||0,rotation[1]||0,rotation[2]||0);else obj.rotation.y=rotation||0;obj.updateMatrixWorld(true);staticCloudFromObject(obj,color);return obj;}catch(e){console.warn(file,e);return null;}}"
          new="async function loadStatic(file,pos,rotation,color,height,scale=[1,1,1]){try{let obj;if(['cama.glb','mesadenoche.glb','doorway.glb'].includes(file))obj=proceduralObject(file);else if(file.toLowerCase().endsWith('.glb'))obj=(await new GLTFLoader().loadAsync(A+file)).scene;else obj=await new FBXLoader().loadAsync(A+file);normalizeObject(obj,height);obj.scale.x*=scale[0];obj.scale.y*=scale[1];obj.scale.z*=scale[2];obj.position.set(pos[0],pos[1],pos[2]);if(Array.isArray(rotation))obj.rotation.set(rotation[0]||0,rotation[1]||0,rotation[2]||0);else obj.rotation.y=rotation||0;obj.updateMatrixWorld(true);staticCloudFromObject(obj,color);return obj;}catch(e){console.warn(file,e);return null;}}"
          if old not in s: raise SystemExit('loadStatic target missing')
          s=s.replace(old,new)

          old_room="function room(){const arr=[];for(let x=-8;x<=8;x+=.24)for(let z=-6;z<=5.5;z+=.24)arr.push(x,-.03,z);for(let y=0;y<=4.3;y+=.24){for(let x=-8;x<=8;x+=.32){arr.push(x,y,-6,x,y,5.5)}for(let z=-6;z<=5.5;z+=.32){arr.push(-8,y,z,8,y,z)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));scene.add(new THREE.Points(g,mat(palette.room,.014,.22)));}"
          new_room="function room(){const arr=[];for(let x=-12;x<=7;x+=.24)for(let z=-6;z<=9;z+=.24)arr.push(x,-.03,z);for(let x=-12;x<=-3.5;x+=.24)for(let z=-5.5;z<=4.5;z+=.24)arr.push(x,4.45,z);for(let y=0;y<=10;y+=.28){for(let x=-12;x<=7;x+=.36){arr.push(x,y,-6,x,y,9)}for(let z=-6;z<=9;z+=.36){arr.push(-12,y,z,7,y,z)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));scene.add(new THREE.Points(g,mat(palette.room,.014,.22)));}"
          if old_room not in s: raise SystemExit('room target missing')
          s=s.replace(old_room,new_room)

          start=s.index("loadStatic('desktop_computer.glb'")
          end=s.index('loadHuman();',start)+len('loadHuman();')
          calls="""loadStatic('desktop_computer.glb',[-1,1.25,2.25],[0,-.062,0],palette.computer,1.6,[.6,.6,.6]);loadStatic('router.glb',[1.25,1,-3.25],[3.142,.562,-3.142],palette.network,.5,[1,1,1]);loadStatic('Laptop.fbx',[1,1,-2],[0,-1.524,0],palette.computer,1.05,[.6,.6,.6]);loadStatic('stairs.glb',[-4,0,7.5],[0,.088,0],palette.structure,2.3,[1.7,2.1,1.2]);loadStatic('door.glb',[5.25,-.25,1.5],[-3.142,1.55,-3.142],palette.structure,2.6,[1.5,1.5,1.5]);loadStatic('heating_battery.glb',[2,0,-5.25],[3.141,0,3.141],palette.structure,1,[1.2,1.2,1.2]);loadStatic('ceiling_fan.glb',[0,4.75,0],[0,0,0],palette.structure,1,[.5,.5,.5]);loadStatic('coffee_table.glb',[1,0,-2.5],[0,-1.571,0],palette.structure,1,[.8,.8,.8]);loadStatic('couch.glb',[4,.5,-2.25],[0,-1.571,0],palette.structure,1,[1.6,1.6,1.6]);loadStatic('cellphone.fbx',[-10.5,5.25,2],[3.142,-1.309,3.142],palette.phone,1,[.02,.02,.02]);loadStatic('tv.glb',[-3.5,.75,-2.5],[0,1.571,0],palette.computer,1,[2.2,2.2,2.2]);loadStatic('doorway.glb',[3.25,0,4],[0,0,0],palette.structure,1,[3.89,3.89,3.89]);loadStatic('cama.glb',[-8.5,4.5,-.25],[0,0,0],palette.structure,1,[3.04,1.96,4.38]);loadStatic('mesadenoche.glb',[-10.75,4.5,2.25],[0,1.571,0],palette.structure,1,[1,1,1]);loadStatic('mesadenoche.glb',[-10.75,4.75,-2.75],[0,1.571,0],palette.structure,1,[1,1,1]);loadStatic('heating_battery.glb',[-8.25,5,-4.25],[3.141,0,3.141],palette.structure,1,[1.2,1.2,1.2]);loadStatic('ac_indoor.glb',[.5,4.5,-5.25],[0,0,0],palette.structure,1,[.94,.94,.94]);loadStatic('ac_indoor.glb',[-10.75,8.75,-.25],[0,1.571,0],palette.structure,1,[.94,.94,.94]);loadStatic('tv.glb',[-4.25,6.5,-.25],[0,-1.571,0],palette.computer,1,[2.2,2.2,2.2]);loadStatic('doorway.glb',[-8.25,4.5,3.75],[0,0,0],palette.structure,1,[3.89,3.89,3.89]);loadHuman();"""
          s=s[:start]+calls+s[end:]

          old_wifi="const wifiPC=link([2,1.35,-1.75],[-1,1.8,2.25],palette.network,.16),wifiPhone=link([2,1.35,-1.75],[-2,1.52,2.5],palette.phone,.06),wifiLaptop=link([2,1.35,-1.75],[.75,1.35,-1.25],palette.computer,.035);"
          new_wifi="const wifiPC=link([1.25,1.35,-3.25],[-1,1.8,2.25],palette.network,.16),wifiPhone=link([1.25,1.35,-3.25],[-10.5,5.3,2],palette.phone,.06),wifiLaptop=link([1.25,1.35,-3.25],[1,1.35,-2],palette.computer,.035);"
          if old_wifi in s:s=s.replace(old_wifi,new_wifi)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-ware/index.html
          git commit -m 'Apply A-WARE house layout v0.22'
          git push
