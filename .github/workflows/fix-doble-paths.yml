name: Fix Doble paths for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-doble-paths.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite absolute asset paths for subfolder hosting
        run: |
          find doble -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's#"/assets/#"./assets/#g' \
            -e "s#'/assets/#'./assets/#g" \
            -e 's#(`/assets/#(`./assets/#g' \
            -e 's#"/favicon.svg#"./favicon.svg#g' \
            -e "s#'/favicon.svg#'./favicon.svg#g"
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doble
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Doble asset paths for mattgames subfolder'
          git push
