name: Fix A-WARE v0.24 route
on:
  push:
    paths:
      - '.github/workflows/fix-aware-v024-route.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix-aware-v024-route.py
      - name: Validate module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('a-ware/index.html').read_text()
          m=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/aware.mjs').write_text(m[-1])
          PY
          node --check /tmp/aware.mjs
      - name: Commit
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add a-ware/index.html
          git commit -m "Fix A-WARE v0.24 route syntax" || exit 0
          git push