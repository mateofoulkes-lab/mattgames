name: Patch NEON v0.3.15
on:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v0315.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact and unify workshop
        shell: python
        run: |
          from pathlib import Path
          p=Path('neoncr/index.html')
          s=p.read_text(encoding='utf-8')

          # Make the workshop a rigid, identical shell for both tabs.
          s=s.replace("#shop .panel{height:min(738px,92vh);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#07101af7 0%,#02070cf7 58%,#000 100%)}",
                      "#shop .panel{height:min(700px,90vh);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#07101af7 0%,#02070cf7 58%,#000 100%);padding:15px}")
          s=s.replace(".shopTitleBar{margin:-18px -18px 12px;padding:11px 16px;min-height:48px;",
                      ".shopTitleBar{margin:-15px -15px 9px;padding:8px 14px;min-height:42px;")
          s=s.replace("font-size:19px!important;letter-spacing:.16em", "font-size:17px!important;letter-spacing:.16em")
          s=s.replace(".shopTitleIcon{width:28px;height:28px;", ".shopTitleIcon{width:24px;height:24px;")
          s=s.replace(".shopTitleIcon svg{width:18px;height:18px;", ".shopTitleIcon svg{width:15px;height:15px;")

          # Balance and compact the wallet/header area.
          s=s.replace(".shopWallet{margin:0 auto 15px;width:min(360px,94%);", ".shopWallet{margin:0 auto 9px;width:min(330px,92%);")
          s=s.replace("border-radius:16px;padding:10px;", "border-radius:14px;padding:7px 10px;")
          s=s.replace(".walletCoin{width:28px;height:28px;font-size:18px;", ".walletCoin{width:24px;height:24px;font-size:15px;")
          s=s.replace("font-size:clamp(34px,6vw,56px)", "font-size:clamp(29px,5vw,46px)")
          s=s.replace(".sub{font-size:10px;color:#9eb8bf;line-height:1.45;margin:0 auto 12px;", ".sub{font-size:9px;color:#9eb8bf;line-height:1.35;margin:0 auto 7px;")

          # Tabs: exactly same dimensions independent of active tab.
          s=s.replace(".shopTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 7px}",
                      ".shopTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:5px 0 7px;height:31px;flex:0 0 31px}")
          s=s.replace("border-radius:10px;padding:8px;font:inherit;font-size:10px;", "border-radius:9px;padding:0 8px;height:31px;font:inherit;font-size:9px;")

          # Fixed content viewport: tab switching cannot resize/reflow the shell.
          marker=".grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}"
          replacement=".shopContent{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}"
          if marker in s and '.shopContent{' not in s:
              s=s.replace(marker,replacement)

          # Slightly smaller cannon evolution block and upgrade cards.
          s=s.replace("padding:14px 16px;cursor:pointer", "padding:9px 13px;cursor:pointer")
          s=s.replace(".cannonThumb{height:86px;", ".cannonThumb{height:68px;")
          s=s.replace("width:120px;max-width:100%;height:76px", "width:105px;max-width:100%;height:61px")
          s=s.replace(".cannonArrow{font-size:32px;", ".cannonArrow{font-size:27px;")
          s=s.replace("margin-top:7px;font-size:10px", "margin-top:4px;font-size:9px")
          s=s.replace("font-size:17px;font-weight:1000", "font-size:15px;font-weight:1000")
          s=s.replace("min-height:82px", "min-height:74px")
          s=s.replace("padding:6px 10px", "padding:5px 9px")
          s=s.replace("width:46px;height:46px", "width:40px;height:40px")
          s=s.replace("width:30px;height:30px", "width:27px;height:27px")
          s=s.replace("grid-template-columns:46px minmax(0,1fr) auto", "grid-template-columns:40px minmax(0,1fr) auto")
          s=s.replace("gap:2px 9px", "gap:1px 8px")
          s=s.replace(".section{font-size:9px;letter-spacing:.16em;margin:8px 0 4px", ".section{font-size:8px;letter-spacing:.16em;margin:5px 0 3px")

          # Footer/button is a reserved row and can never escape the panel.
          s=s.replace(".foot{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:11px}",
                      ".foot{display:flex;justify-content:center;align-items:center;gap:8px;flex:0 0 51px;margin-top:auto;padding:6px 0 0;overflow:visible}")
          s=s.replace(".playBtn{min-width:210px;padding:13px 30px;", ".playBtn{min-width:195px;padding:10px 26px;")
          s=s.replace("font-size:15px;font-weight:1000", "font-size:14px;font-weight:1000")

          # Wrap tab-specific content in one fixed content area if not already done.
          old='<div class="shopTabs"><button id="tabCannon" class="shopTab active">CAÑÓN</button><button id="tabNodes" class="shopTab nodes">NODOS</button></div><div id="cannonBlock">'
          new='<div class="shopTabs"><button id="tabCannon" class="shopTab active">CAÑÓN</button><button id="tabNodes" class="shopTab nodes">NODOS</button></div><div class="shopContent"><div id="cannonBlock">'
          if old in s:
              s=s.replace(old,new)
              s=s.replace('<div id="upgradeTitle" class="section">MEJORAS DE CAÑÓN</div><div id="upgradeGrid" class="grid"></div><div class="foot">', '<div id="upgradeTitle" class="section">MEJORAS DE CAÑÓN</div><div id="upgradeGrid" class="grid"></div></div><div class="foot">')

          s=s.replace('v0.3.14','v0.3.15')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git commit -m "Unify and compact NEON workshop tabs" || exit 0
          git push
