name: Fix El Topo v0.10.12 Spyfall final reliability
on:
  push:
    paths:
      - '.github/workflows/fix-v01012-spyfall-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Spyfall final voting
        run: echo ' ' | base64 -d | python
      - name: Validate JavaScript
        run: node --check eltopo/social-game.js && node --check eltopo/mixed-avatar-sync.js
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/fix-v01012-spyfall-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Spyfall final voting acknowledged and canonical' || exit 0
          git push