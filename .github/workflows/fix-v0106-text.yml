name: Fix El Topo v0.10.6 copy
on:
  push:
    paths:
      - 'eltopo/tools/fix_v0106_text.py'
      - '.github/workflows/fix-v0106-text.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python eltopo/tools/fix_v0106_text.py
      - run: node --check eltopo/social-game.js
      - run: rm -f eltopo/tools/fix_v0106_text.py .github/workflows/fix-v0106-text.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eltopo/social-game.js eltopo/tools/fix_v0106_text.py .github/workflows/fix-v0106-text.yml || true
          git diff --cached --quiet || git commit -m 'Finish Spyfall 20 second copy'
          git push
