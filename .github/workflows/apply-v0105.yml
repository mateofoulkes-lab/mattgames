name: Apply El Topo v0.10.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0105.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Spyfall fixes
        run: python .github/scripts/apply_eltopo_v0105.py
      - name: Validate JavaScript
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
          node --check eltopo/metered-trystero-adapter.js
      - name: Remove one-off patch files
        run: |
          rm .github/scripts/apply_eltopo_v0105.py
          rm .github/workflows/apply-v0105.yml
      - name: Commit v0.10.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eltopo/social-game.js eltopo/index.html eltopo/mixed-avatar-sync.js .github/scripts/apply_eltopo_v0105.py .github/workflows/apply-v0105.yml
          git commit -m 'Fix Spyfall final voting and lobby back navigation'
          git push
