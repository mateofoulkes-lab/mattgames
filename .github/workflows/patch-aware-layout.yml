name: Patch A-WARE layout
on:
  push:
    paths:
      - '.github/workflows/patch-aware-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-aware-v023.py
      - run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add a-ware/editor.html a-ware/index.html
          git commit -m "Update A-WARE layout" || exit 0
          git push