name: Sync A-WARE layout json
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-aware-layout-json.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch editor and game
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          e=Path('a-ware/editor.html')
          s=e.read_text(encoding='utf-8')
          repl="const layout=await (await fetch('./layout.json',{cache:'no-store'})).json();const init=layout.instances.map(d=>[d.name,d.file,d.h,d.position,d.rotation,d.scale]),initWps=layout.waypoints||[];"
          s,n=re.subn(r"const init=\[.*?\];(?=const R=)",repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('editor init not found')
          tail="for(const d of init)await add(d[1],{name:d[0],h:d[2],position:d[3],rotation:d[4],scale:d[5]});"
          if tail not in s: raise SystemExit('editor tail not found')
          s=s.replace(tail,tail+"for(const d of initWps){$('wpName').value=d.name;$('wpAnim').value=d.animation;await createWp();const w=wps[wps.length-1];w.position.fromArray(d.position);w.rotation.set(...d.rotation);}$('wpName').value='';",1)
          e.write_text(s,encoding='utf-8')

          p=Path('a-ware/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('A-WARE v0.22 · POINT-CLOUD PROTOTYPE','A-WARE v0.23 · POINT-CLOUD PROTOTYPE')
          block="""room();
const houseLayout=await (await fetch('./layout.json',{cache:'no-store'})).json();
function colorFor(file){if(file==='router.glb')return palette.network;if(file==='cellphone.fbx')return palette.phone;if(file==='desktop_computer.glb'||file==='Laptop.fbx'||file==='tv.glb')return palette.computer;return palette.structure;}
for(const d of houseLayout.instances)loadStatic(d.file,d.position,d.rotation,colorFor(d.file),d.h,d.scale);
loadHuman();
const byName=n=>houseLayout.instances.find(x=>x.name===n),rp=byName('ROUTER').position,pp=byName('PC').position,ph=byName('PHONE').position,lp=byName('LAPTOP').position;
const wifiPC=link([rp[0],rp[1]+.35,rp[2]],[pp[0],pp[1]+.55,pp[2]],palette.network,.16),wifiPhone=link([rp[0],rp[1]+.35,rp[2]],[ph[0],ph[1]+.05,ph[2]],palette.phone,.06),wifiLaptop=link([rp[0],rp[1]+.35,rp[2]],[lp[0],lp[1]+.35,lp[2]],palette.computer,.035);"""
          s,n=re.subn(r"room\(\);\nloadStatic\(.*?const wifiLaptop=link\(.*?;",block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('game scene block not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-ware/editor.html a-ware/index.html
          git commit -m 'Use shared A-WARE layout json'
          git push
