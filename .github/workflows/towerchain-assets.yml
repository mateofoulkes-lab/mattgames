name: Tower Chain assets

on:
  push:
    branches: [main]
    paths:
      - 'towerchain/index.html'
      - 'towerchain/style.css'
      - 'towerchain/game.js'
      - 'towerchain/README.md'
      - '.github/workflows/towerchain-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prepared Tower Chain assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p towerchain/assets/generated
          curl -fL --retry 3 'https://at.adobe.com/aCtvmrR1Q8FkVclS' -o towerchain/assets/generated/towers_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/lQLDYDKeXRqrswH6' -o towerchain/assets/generated/enemies_early_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/ATaklBdgJmFfv9PB' -o towerchain/assets/generated/enemies_late_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/3YiPQZYPVWE3uVyl' -o towerchain/assets/generated/cupcake_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/Z937azaSHkckvFM9' -o towerchain/assets/generated/projectiles_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/iZ6Nyqn5K1JU8qvk' -o towerchain/assets/generated/effects_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/ZTRgkcokp8WSzNSr' -o towerchain/assets/generated/cards_atlas.webp
          curl -fL --retry 3 'https://at.adobe.com/Vwqk9EF2yftHfK21' -o towerchain/assets/generated/battlefield.jpg
          curl -fL --retry 3 'https://at.adobe.com/KJCRP45VmTnLxrsq' -o towerchain/assets/generated/splash.jpg
          curl -fL --retry 3 'https://at.adobe.com/KBpFyD1uDHel53p1' -o towerchain/assets/generated/hud_transparent.png
          file towerchain/assets/generated/*

      - name: Tune gameplay and lightning visuals
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('towerchain/game.js')
          s = p.read_text()

          # Keep the established pathing/tower progression, but ease enemy speed ~12%.
          start = s.index('function enemyDef(w){')
          end = s.index('function spawn(){')
          enemy_def = """function enemyDef(w){if(w<7)return{set:'enemies',row:0,hp:35,spd:148,size:62};if(w<14)return{set:'enemies',row:1,hp:70,spd:141,size:75};if(w<21)return{set:'enemies',row:2,hp:95,spd:162,size:78};if(w<28)return{set:'enemies',row:3,hp:125,spd:150,size:70};if(w<34)return{set:'enemies',row:4,hp:190,spd:130,size:82};if(w<40)return{set:'enemies',row:5,hp:260,spd:136,size:90};if(w<46)return{set:'enemies',row:6,hp:330,spd:128,size:82};if(w<51)return{set:'enemies',row:7,hp:430,spd:123,size:82};if(w<56)return{set:'late_enemies',row:3,hp:650,spd:118,size:105};if(w<60)return{set:'late_enemies',row:6,hp:900,spd:111,size:120};return{set:'late_enemies',row:7,hp:12500,spd:64,size:Math.min(H*.72,560),boss:true}}"""
          s = s[:start] + enemy_def + s[end:]

          # Replace hit() so lightning stores visible source/target arcs.
          hit_start = s.index('function hit(e,s){')
          hit_end = s.index('function chooseCards(')
          hit_fn = """function hit(e,s){let dmg=s.damage*(Math.random()<state.crit?2:1);e.hp-=dmg;e.burn=Math.max(e.burn,state.fire*4);e.slow=Math.max(e.slow,state.ice);state.fx.push({x:e.x,y:e.y,t:.18,type:0});if(state.explosion)for(const o of state.enemies)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<95)o.hp-=state.explosion;if(state.lightning){let source=e;for(const o of state.enemies.filter(o=>o!==e&&o.hp>0).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y)).slice(0,state.lightning)){o.hp-=dmg*.35;state.fx.push({x:o.x,y:o.y,t:.18,type:1,x1:source.x,y1:source.y,x2:o.x,y2:o.y});source=o}}}"""
          s = s[:hit_start] + hit_fn + s[hit_end:]

          # Replace the FX renderer with circles + jagged vector lightning bolts.
          old = "for(const f of state.fx){X.globalAlpha=Math.min(1,f.t*8);X.beginPath();X.arc(f.x,f.y,28*(1-f.t),0,Math.PI*2);X.fillStyle=f.type?'#a264ff':'#ffb12a';X.fill();X.globalAlpha=1}"
          new = "for(const f of state.fx){X.globalAlpha=Math.min(1,f.t*8);if(f.type===1&&f.x1!==undefined){let pts=7,dx=f.x2-f.x1,dy=f.y2-f.y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;X.save();X.lineCap='round';X.lineJoin='round';X.shadowBlur=16;X.shadowColor='#73d9ff';X.strokeStyle='#68cfff';X.lineWidth=7;X.beginPath();X.moveTo(f.x1,f.y1);for(let i=1;i<pts;i++){let q=i/pts,j=(Math.random()-.5)*18;X.lineTo(f.x1+dx*q+nx*j,f.y1+dy*q+ny*j)}X.lineTo(f.x2,f.y2);X.stroke();X.shadowBlur=5;X.strokeStyle='#f4fbff';X.lineWidth=2;X.stroke();X.restore()}else{X.beginPath();X.arc(f.x,f.y,28*(1-f.t),0,Math.PI*2);X.fillStyle=f.type?'#a264ff':'#ffb12a';X.fill()}X.globalAlpha=1}"
          if old in s:
              s = s.replace(old, new)
          elif "if(f.type===1&&f.x1!==undefined)" not in s:
              raise SystemExit('FX renderer pattern not found')

          p.write_text(s)

      - name: Commit runtime art and tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add towerchain/assets/generated towerchain/game.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tune Tower Chain speed and lightning visuals'
          git push
