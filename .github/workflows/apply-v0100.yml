name: Apply El Topo v0.10.0
on:
  push:
    paths:
      - 'eltopo/tools/apply_v0100_gameplay_fixes.py'
      - 'eltopo/fixes-v010.css'
      - '.github/workflows/apply-v0100.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v0.10.0 fixes
        run: python eltopo/tools/apply_v0100_gameplay_fixes.py
      - name: Validate JavaScript
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
      - name: Commit v0.10.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eltopo/social-game.js eltopo/index.html eltopo/mixed-avatar-sync.js eltopo/fixes-v010.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix El Topo presence mixed mode and Spyfall turns'
            git push
          fi
