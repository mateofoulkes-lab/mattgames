name: Apply A-WARE room layout v0.21
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-aware-layout-v021.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply room layout and editor precision
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('a-ware/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('A-WARE v0.20 · POINT-CLOUD PROTOTYPE','A-WARE v0.21 · POINT-CLOUD PROTOTYPE')

          old = "async function loadStatic(file,pos,rot,color,height){try{let obj;if(file.toLowerCase().endsWith('.glb'))obj=(await new GLTFLoader().loadAsync(A+file)).scene;else obj=await new FBXLoader().loadAsync(A+file);normalizeObject(obj,height);obj.position.x+=pos[0];obj.position.y+=pos[1];obj.position.z+=pos[2];obj.rotation.y=rot||0;obj.updateMatrixWorld(true);staticCloudFromObject(obj,color);return obj;}catch(e){console.warn(file,e);return null;}}"
          new = "async function loadStatic(file,pos,rotation,color,height,scale=[1,1,1]){try{let obj;if(file.toLowerCase().endsWith('.glb'))obj=(await new GLTFLoader().loadAsync(A+file)).scene;else obj=await new FBXLoader().loadAsync(A+file);normalizeObject(obj,height);obj.scale.x*=scale[0];obj.scale.y*=scale[1];obj.scale.z*=scale[2];obj.position.set(pos[0],pos[1],pos[2]);if(Array.isArray(rotation))obj.rotation.set(rotation[0]||0,rotation[1]||0,rotation[2]||0);else obj.rotation.y=rotation||0;obj.updateMatrixWorld(true);staticCloudFromObject(obj,color);return obj;}catch(e){console.warn(file,e);return null;}}"
          if old not in s:
              raise SystemExit('loadStatic target not found')
          s = s.replace(old,new)

          s = s.replace("normalizeObject(humanRoot,3.15);humanRoot.position.set(-.25,0,.35);humanRoot.rotation.y=-.15;scene.add(humanRoot);",
                        "normalizeObject(humanRoot,3.15);humanRoot.position.set(-.25,0,1.5);humanRoot.rotation.set(0,-.15,0);humanRoot.scale.multiply(new THREE.Vector3(1,1,1));scene.add(humanRoot);")

          old_calls = "loadStatic('desktop_computer.glb',[-2.8,0,-1.1],.2,palette.computer,1.6);loadStatic('router.glb',[3.4,.1,-2.2],-.3,palette.network,.5);loadStatic('cellphone.fbx',[1.3,.75,.25],.2,palette.phone,.35);loadStatic('Laptop.fbx',[3.0,0,1.7],-1.0,palette.computer,1.05);loadStatic('stairs.glb',[-5.4,0,1.6],.35,palette.structure,2.3);loadStatic('door.glb',[5.2,0,-.3],-1.55,palette.structure,2.6);loadHuman();"
          new_calls = "loadStatic('desktop_computer.glb',[-1,1.25,2.25],[0,-.062,0],palette.computer,1.6,[.6,.6,.6]);loadStatic('router.glb',[2,1,-1.75],[0,-.3,0],palette.network,.5,[1,1,1]);loadStatic('Laptop.fbx',[.75,1,-1.25],[0,.047,0],palette.computer,1.05,[.6,.6,.6]);loadStatic('stairs.glb',[7.5,-4.75,1],[0,.088,0],palette.structure,2.3,[1.7,2.1,1.2]);loadStatic('door.glb',[5.2,0,-.3],[0,-1.55,0],palette.structure,2.6,[1.5,1.5,1.5]);loadStatic('heating_battery.glb',[3.75,0,-5.25],[-3.142,0,-3.142],palette.structure,1,[1.2,1.2,1.2]);loadStatic('ceiling_fan.glb',[0,4.75,0],[0,0,0],palette.structure,1,[.5,.5,.5]);loadStatic('coffee_table.glb',[1,0,-1.5],[0,0,0],palette.structure,1,[.8,.8,.8]);loadStatic('couch.glb',[.5,.5,-4],[0,0,0],palette.structure,1,[1.6,1.6,1.6]);loadStatic('cellphone.fbx',[-2,1.5,2.5],[0,0,0],palette.phone,1,[.02,.02,.02]);loadStatic('tv.glb',[-3.5,.75,-1.5],[0,1.571,0],palette.computer,1,[2.2,2.2,2.2]);loadHuman();"
          if old_calls not in s:
              raise SystemExit('scene calls target not found')
          s = s.replace(old_calls,new_calls)

          old_wifi = "const wifiPC=link([3.4,.5,-2.2],[-2.2,1.15,-1],palette.network,.16),wifiPhone=link([3.4,.5,-2.2],[1.3,.9,.25],palette.phone,.06),wifiLaptop=link([3.4,.5,-2.2],[3,1,1.7],palette.computer,.035);"
          new_wifi = "const wifiPC=link([2,1.35,-1.75],[-1,1.8,2.25],palette.network,.16),wifiPhone=link([2,1.35,-1.75],[-2,1.52,2.5],palette.phone,.06),wifiLaptop=link([2,1.35,-1.75],[.75,1.35,-1.25],palette.computer,.035);"
          if old_wifi not in s:
              raise SystemExit('wifi target not found')
          s = s.replace(old_wifi,new_wifi)
          p.write_text(s,encoding='utf-8')

          e = Path('a-ware/editor.html')
          t = e.read_text(encoding='utf-8')
          if "x.setScaleSnap(.1)" not in t:
              raise SystemExit('editor scale snap target not found')
          t = t.replace("x.setScaleSnap(.1)","x.setScaleSnap(.01)")
          e.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-ware/index.html a-ware/editor.html
          git commit -m 'Apply A-WARE room layout v0.21'
          git push
