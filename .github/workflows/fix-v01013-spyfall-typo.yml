name: Fix El Topo v0.10.13 Spyfall runtime
on:
  push:
    paths:
      - '.github/workflows/fix-v01013-spyfall-typo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runtime typo and bump version
        run: python -c "from pathlib import Path; p=Path('eltopo/social-game.js'); s=p.read_text(encoding='utf-8').replace('SP_LOCATIONS.map','SPY_LOCATIONS.map').replace('v0.10.12','v0.10.13'); p.write_text(s,encoding='utf-8'); h=Path('eltopo/index.html'); h.write_text(h.read_text(encoding='utf-8').replace('v0.10.12','v0.10.13'),encoding='utf-8'); m=Path('eltopo/mixed-avatar-sync.js'); m.write_text(m.read_text(encoding='utf-8').replace('v0.10.12','v0.10.13'),encoding='utf-8')"
      - name: Validate JavaScript and runtime symbol
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
          if grep -q 'SP_LOCATIONS' eltopo/social-game.js; then echo 'Bad symbol remains'; exit 1; fi
          grep -q "SPY_LOCATIONS.map" eltopo/social-game.js
          grep -q "const VERSION = '0.10.13'" eltopo/social-game.js
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/fix-v01013-spyfall-typo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Spyfall canonical location runtime and bump v0.10.13' || exit 0
          git push