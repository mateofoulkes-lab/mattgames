name: Process El Topo portraits

on:
  push:
    paths:
      - 'eltopo/portraitspng/**'
      - 'eltopo/tools/process_portraits.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python eltopo/tools/process_portraits.py
      - name: Commit processed JPGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eltopo/portraits eltopo/avatar-manifest.json
          if git diff --cached --quiet; then
            echo "No portrait changes"
          else
            git commit -m "Process El Topo portraits"
            git push
          fi
