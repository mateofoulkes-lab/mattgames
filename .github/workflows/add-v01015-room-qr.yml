name: Add El Topo v0.10.15 room QR
on:
  push:
    paths:
      - '.github/workflows/add-v01015-room-qr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add room QR invite
        run: |
          python - <<'PY'
          from pathlib import Path

          # index.html
          p=Path('eltopo/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('0.10.14','0.10.15')
          old='''          <button id="lobbyCopyCode" class="lobby-copy-btn">Copiar</button>'''
          new='''          <div class="lobby-code-actions">
            <button id="lobbyCopyCode" class="lobby-copy-btn">Copiar</button>
            <button id="lobbyQrBtn" class="lobby-copy-btn lobby-qr-btn hidden" type="button">QR</button>
          </div>'''
          assert old in s
          s=s.replace(old,new,1)

          marker='''  <div id="genericModal" class="modal-backdrop hidden">'''
          qr='''  <div id="roomQrModal" class="modal-backdrop hidden">
    <div class="room-qr-card">
      <div class="room-qr-head">
        <div><span>INVITAR A LA SALA</span><h2>Escaneá para entrar</h2></div>
        <button id="closeRoomQr" class="modal-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <div id="roomQrImage" class="room-qr-image" aria-label="Código QR de la sala"></div>
      <div class="room-qr-code"><span>SALA</span><strong id="roomQrCode">----</strong></div>
      <p>Escaneá el QR con la cámara del celular. El código de sala se carga automáticamente; sólo falta poner el nombre y entrar.</p>
      <small id="roomQrLink"></small>
      <button id="copyRoomInvite" class="room-qr-copy" type="button">Copiar enlace de invitación</button>
    </div>
  </div>

'''
          assert marker in s
          s=s.replace(marker,qr+marker,1)

          marker='''  <script src="https://unpkg.com/@metered-ca/realtime@1/dist/index.umd.js"></script>'''
          scripts='''  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://unpkg.com/@metered-ca/realtime@1/dist/index.umd.js"></script>'''
          assert marker in s
          s=s.replace(marker,scripts,1)
          p.write_text(s,encoding='utf-8')

          # social-game.js
          p=Path('eltopo/social-game.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('0.10.14','0.10.15')

          old="""  if($('lobbyModeHint'))$('lobbyModeHint').textContent=isAdmin?'Elegí qué van a jugar.':'El administrador está eligiendo el modo.';"""
          new="""  if($('lobbyModeHint'))$('lobbyModeHint').textContent=isAdmin?'Elegí qué van a jugar.':'El administrador está eligiendo el modo.';
  const qrBtn=$('lobbyQrBtn'); if(qrBtn)qrBtn.classList.toggle('hidden',!isAdmin);"""
          assert old in s
          s=s.replace(old,new,1)

          marker='''function showModal(title,html,after){ const m=$('genericModal');'''
          funcs=r'''function roomInviteUrl(){
  const u=new URL(location.href);
  u.search='';
  u.hash='';
  u.searchParams.set('room',roomCode);
  return u.toString();
}
function openRoomQr(){
  if(!isAdmin||!roomCode)return;
  const modal=$('roomQrModal'),box=$('roomQrImage');
  if(!modal||!box)return;
  if(typeof window.qrcode!=='function'){toast('No pude generar el QR.');return;}
  const invite=roomInviteUrl();
  const qr=window.qrcode(0,'M');
  qr.addData(invite);
  qr.make();
  box.innerHTML=qr.createSvgTag(7,4);
  if($('roomQrCode'))$('roomQrCode').textContent=roomCode;
  if($('roomQrLink'))$('roomQrLink').textContent=invite.replace(/^https?:\/\//,'');
  modal.classList.remove('hidden');
}
function closeRoomQr(){ $('roomQrModal')?.classList.add('hidden'); }
function applyRoomInviteFromUrl(){
  const invite=cleanCode(new URLSearchParams(location.search).get('room'));
  if(invite.length!==4)return;
  if($('joinCode'))$('joinCode').value=invite;
  if($('joinRoomBtn'))$('joinRoomBtn').textContent=`Entrar a ${invite}`;
  if($('landingError'))$('landingError').textContent=`Invitación a la sala ${invite}. Poné tu nombre para entrar.`;
  setTimeout(()=>$('playerName')?.focus(),0);
}

'''
          assert marker in s
          s=s.replace(marker,funcs+marker,1)

          old="""$('lobbyCopyCode')?.addEventListener('click',()=>navigator.clipboard?.writeText(roomCode).then(()=>toast('Código copiado')));"""
          new="""$('lobbyCopyCode')?.addEventListener('click',()=>navigator.clipboard?.writeText(roomCode).then(()=>toast('Código copiado')));
$('lobbyQrBtn')?.addEventListener('click',openRoomQr);
$('closeRoomQr')?.addEventListener('click',closeRoomQr);
$('copyRoomInvite')?.addEventListener('click',()=>navigator.clipboard?.writeText(roomInviteUrl()).then(()=>toast('Enlace copiado')));
$('roomQrModal')?.addEventListener('click',e=>{if(e.target.id==='roomQrModal')closeRoomQr();});"""
          assert old in s
          s=s.replace(old,new,1)

          old='''buildEmojiPicker(); renderComposerReply(); renderAll();'''
          new='''applyRoomInviteFromUrl(); buildEmojiPicker(); renderComposerReply(); renderAll();'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # lobby.css
          p=Path('eltopo/lobby.css')
          s=p.read_text(encoding='utf-8')
          styles=r'''
.lobby-code-actions{display:flex;align-items:center;gap:7px}.lobby-qr-btn{background:linear-gradient(135deg,var(--lobby-accent-2),#4c9aff);color:#fff}.room-qr-card{width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#202338;color:#f7f7fb;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.5)}.room-qr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.room-qr-head span{display:block;font-size:9px;font-weight:900;letter-spacing:.15em;color:#aeb3c7}.room-qr-head h2{margin:3px 0 0;font-size:22px}.room-qr-head .modal-close{flex:0 0 auto}.room-qr-image{background:#fff;border-radius:18px;padding:14px;width:min(320px,100%);margin:0 auto;display:grid;place-items:center}.room-qr-image svg{display:block;width:100%;height:auto}.room-qr-code{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 8px}.room-qr-code span{font-size:9px;font-weight:900;letter-spacing:.13em;color:#aeb3c7}.room-qr-code strong{font-size:28px;letter-spacing:.18em}.room-qr-card p{text-align:center;color:#c5c9d8;font-size:12px;line-height:1.5;margin:8px auto;max-width:350px}.room-qr-card small{display:block;text-align:center;color:#8f95ad;font-size:9px;word-break:break-all;margin:8px 0 14px}.room-qr-copy{display:block;width:100%;border:0;border-radius:12px;padding:12px 14px;background:#ffb44a;color:#2b2114;font-weight:900}.room-qr-copy:active,.lobby-qr-btn:active{transform:translateY(1px)}
@media(max-width:520px){.lobby-code-actions{gap:5px}.lobby-code-actions .lobby-copy-btn{padding:9px 10px}.room-qr-card{padding:16px}.room-qr-head h2{font-size:19px}.room-qr-image{width:min(290px,100%)}}
'''
          if '.room-qr-card{' not in s:
              s += styles
          p.write_text(s,encoding='utf-8')

          # mixed-avatar-sync build version
          p=Path('eltopo/mixed-avatar-sync.js')
          s=p.read_text(encoding='utf-8').replace('0.10.14','0.10.15')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
          grep -q "const VERSION = '0.10.15'" eltopo/social-game.js
          grep -q 'roomQrModal' eltopo/index.html
          grep -q 'qrcode-generator@1.4.4' eltopo/index.html
          grep -q 'social-game.js?v=0.10.15' eltopo/index.html
          grep -q 'lobby.css?v=0.10.15' eltopo/index.html
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/add-v01015-room-qr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add QR room invites to El Topo v0.10.15' || exit 0
          git push
