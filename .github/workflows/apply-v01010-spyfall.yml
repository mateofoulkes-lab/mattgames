name: Apply El Topo v0.10.10 Spyfall reliability
on:
  push:
    paths:
      - 'eltopo/tools/fix_v01010_spyfall.py'
      - '.github/workflows/apply-v01010-spyfall.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v0.10.10 fixes
        run: python eltopo/tools/fix_v01010_spyfall.py
      - name: Validate JavaScript
        run: node --check eltopo/social-game.js && node --check eltopo/mixed-avatar-sync.js
      - name: Remove one-off patch files
        run: rm -f eltopo/tools/fix_v01010_spyfall.py .github/workflows/apply-v01010-spyfall.yml
      - name: Commit v0.10.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Spyfall rotation voting sync and lobby back' || exit 0
          git push
