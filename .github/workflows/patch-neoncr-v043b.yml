name: Patch NEON v0.4.3b
on:
  push:
    paths:
      - '.github/workflows/patch-neoncr-v043b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('neoncr/index.html').read_text()
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/check.js').write_text(js)
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "mateofoulkes-lab"
          git config user.email "mateofoulkes@gmail.com"
          git add neoncr/index.html
          git commit -m "Teach cannon controls and add charge meter"
          git push
