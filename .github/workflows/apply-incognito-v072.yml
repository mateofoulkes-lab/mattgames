name: Apply Incognito v0.7.2

on:
  push:
    paths:
      - 'eltopo/tools/apply_incognito_v072.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python eltopo/tools/apply_incognito_v072.py
      - name: Commit Incognito changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eltopo/social-game.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Incognito identity privacy and personas"
            git push
          fi
