name: Import games into mattgames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'

permissions:
  contents: write

jobs:
  import-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mattgames
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Battle City 3D
        run: |
          rm -rf battlecity3d /tmp/battlecity3d
          git clone --depth 1 https://github.com/mateofoulkes-lab/battlecity3d.git /tmp/battlecity3d
          mkdir -p battlecity3d
          rsync -a --exclude='.git' /tmp/battlecity3d/ battlecity3d/

      - name: Import Tetonor
        run: |
          rm -rf tetonor /tmp/tetonor
          git clone --depth 1 https://github.com/mateofoulkes-lab/tetonor.git /tmp/tetonor
          mkdir -p tetonor
          rsync -a --exclude='.git' /tmp/tetonor/ tetonor/

      - name: Try to mirror Doble from Sites
        continue-on-error: true
        run: |
          rm -rf doble /tmp/doble-mirror
          mkdir -p doble /tmp/doble-mirror
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent \
            --directory-prefix=/tmp/doble-mirror \
            https://doble-cartas.patedoz.chatgpt.site/ || true
          SRC=$(find /tmp/doble-mirror -type f -name 'index.html' -printf '%h\n' | head -n 1)
          if [ -n "$SRC" ]; then
            cp -a "$SRC"/. doble/
          else
            cat > doble/index.html <<'EOF'
          <!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doble</title><body style="font-family:system-ui;background:#111827;color:white;padding:30px"><h1>Doble</h1><p>No se pudo espejar automáticamente la versión de Sites.</p></body></html>
          EOF
          fi

      - name: Create game selector
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#080b13">
            <title>Matt Games</title>
            <style>
              *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;padding:34px 18px;background:radial-gradient(circle at 50% -10%,#273653 0,#0c1220 42%,#05070c 100%);color:#f8fafc}.wrap{width:min(1040px,100%);margin:auto}.brand{margin-bottom:30px}.brand small{font-weight:800;letter-spacing:.24em;color:#60a5fa}.brand h1{margin:5px 0 4px;font-size:clamp(42px,9vw,80px);letter-spacing:-.06em}.brand p{margin:0;color:#94a3b8;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{display:block;min-height:210px;padding:22px;border-radius:22px;border:1px solid #334155;background:linear-gradient(145deg,rgba(30,41,59,.93),rgba(15,23,42,.93));box-shadow:0 18px 45px #0006;text-decoration:none;color:inherit;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-5px);border-color:#60a5fa}.icon{font-size:43px}.card h2{margin:16px 0 7px;font-size:24px}.card p{margin:0;color:#94a3b8;line-height:1.4}.pill{display:inline-block;margin-top:16px;padding:5px 9px;border-radius:999px;background:#0f172a;color:#bfdbfe;font-size:11px;font-weight:800;letter-spacing:.08em}
            </style>
          </head>
          <body><main class="wrap"><header class="brand"><small>COLECCIÓN</small><h1>MATT GAMES</h1><p>Todos los juegos, desde un solo lugar.</p></header><section class="grid">
            <a class="card" href="./eltopo/"><div class="icon">🕵️</div><h2>El Topo</h2><p>Roles ocultos, sospechas y engaño.</p><span class="pill">MULTIJUGADOR</span></a>
            <a class="card" href="./battlecity3d/"><div class="icon">💥</div><h2>Battle City 3D</h2><p>Tanques 3D, power-ups y combate online.</p><span class="pill">MULTIJUGADOR</span></a>
            <a class="card" href="./tetonor/"><div class="icon">🔢</div><h2>Tetonor</h2><p>Desafío numérico para navegador.</p><span class="pill">JUGAR</span></a>
            <a class="card" href="./doble/"><div class="icon">🃏</div><h2>Doble</h2><p>Juego de cartas online.</p><span class="pill">MULTIJUGADOR</span></a>
          </section></main></body></html>
          EOF

      - name: Commit imported games
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battlecity3d tetonor doble index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Import Battle City 3D, Tetonor and Doble; add game selector'
          git push
