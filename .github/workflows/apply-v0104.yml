name: Apply El Topo v0.10.4
on:
  push:
    paths:
      - 'eltopo/tools/apply_v0104_chat_system_fix.py'
      - '.github/workflows/apply-v0104.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply message ordering fix
        run: python eltopo/tools/apply_v0104_chat_system_fix.py
      - name: Validate JavaScript
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/mixed-avatar-sync.js
          node --check eltopo/superadmin/admin.js
      - name: Commit v0.10.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eltopo/social-game.js eltopo/index.html eltopo/mixed-avatar-sync.js eltopo/superadmin/admin.js eltopo/superadmin/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Keep Incognito chat and system messages in one order'
            git push
          fi
