name: Apply El Topo v0.8.1

on:
  push:
    paths:
      - '.github/workflows/apply-v081.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Apply patch
        run: python .github/scripts/apply_v081.py
      - name: Validate JavaScript syntax
        run: |
          node --check eltopo/social-game.js
          node --check eltopo/game-data.js
          node --check eltopo/mixed-avatar-sync.js
      - name: Commit v0.8.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eltopo
          git commit -m "Fix Todo mezclado portraits and intro" || exit 0
          git push
